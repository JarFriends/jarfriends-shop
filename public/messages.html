<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Messages · VeeFam</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:wght@600;700;800&display=swap">
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/market.css">
<style>
.mg{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:16px;align-items:start}
@media(max-width:760px){.mg{grid-template-columns:1fr}.mg.open .mg-list{display:none}.mg:not(.open) .mg-thread{display:none}}
.mg-list{display:flex;flex-direction:column;gap:8px}
.mg-item{display:flex;flex-direction:column;gap:3px;text-align:left;background:#11261C;border:1px solid #2E4A3B;border-radius:10px;padding:10px 12px;color:#F7F2E6;cursor:pointer;font:inherit;min-height:0}
.mg-item.on{border-color:#C9A45C}
.mg-item .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mg-item .pv{font-size:13px;color:#B9C9BF;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mg-dot{background:#E5484D;color:#fff;border-radius:10px;font-size:11px;font-weight:800;padding:1px 7px}
.mg-tag{font-size:10px;letter-spacing:.08em;font-weight:800;color:#E8C77A}
.mg-thread{display:flex;flex-direction:column;background:#0F2219;border:1px solid #2E4A3B;border-radius:16px;overflow:hidden;min-height:440px}
.mg-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;background:#132A1F;border-bottom:1px solid #2E4A3B}
.mg-who{display:flex;gap:12px;align-items:center;min-width:0;flex:1}
.mg-av{width:44px;height:44px;border-radius:50%;background:#C9A45C;color:#0B1A13;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;flex:none}
.mg-who .nm{font-size:17px;font-weight:800;line-height:1.2}
.mg-piece{display:flex;gap:10px;align-items:center;margin:12px 16px 0;padding:8px 10px;border:1px solid #2E4A3B;border-radius:12px;background:#11261C;text-decoration:none;color:inherit}
.mg-piece img,.mg-piece .ph{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#0B1712;flex:none}
.mg-piece .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.mg-piece .tx b{font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mg-links{display:flex;gap:8px;flex-wrap:wrap}
.mg-links a{padding:7px 12px;border:1px solid #4E7A63;border-radius:999px;text-decoration:none;font-size:13px;font-weight:700;color:#E8C77A}
.mg-msgs{display:flex;flex-direction:column;gap:10px;flex:1;min-height:220px;max-height:56vh;overflow-y:auto;padding:16px}
.mg-b{max-width:78%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word;line-height:1.45;font-size:15px;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.mg-b.me{align-self:flex-end;background:#C9A45C;color:#0B1A13;border-bottom-right-radius:6px}
.mg-b.them{align-self:flex-start;background:#1E3D2E;color:#F7F2E6;border-bottom-left-radius:6px}
.mg-t{font-size:11px;opacity:.65;margin-top:4px;text-align:right}
.mg-hint{align-self:center;text-align:center;max-width:420px;color:#B9C9BF;font-size:14px;padding:18px 8px}
form.mg-say{display:flex!important;flex-direction:row!important;gap:10px!important;align-items:flex-end!important;max-width:none!important;padding:12px 14px;border-top:1px solid #2E4A3B;background:#132A1F;margin:0}
.mg-say textarea{flex:1;min-width:0;height:46px;min-height:46px;max-height:140px;resize:none;font:inherit;font-size:16px;line-height:1.35;padding:12px 16px;background:#0B1A13;border:1px solid #4E7A63;color:#F7F2E6;border-radius:23px;box-sizing:border-box}
.mg-say textarea:focus{outline:none;border-color:#C9A45C}
.mg-say button{width:46px;height:46px;min-height:0;border-radius:50%;padding:0;font-size:20px;flex:none;display:flex;align-items:center;justify-content:center}
.mg-status{padding:0 16px 10px;min-height:0}
.mg-back{display:none}
@media(max-width:760px){.jfn-help{display:none!important}}
@media(max-width:760px){.mg-back{display:inline-flex}}
</style>
</head>
<body>
<header class="top"><div class="wrap bar"><a class="brand" href="/" style="text-decoration:none">VeeFam</a><span style="display:flex;align-items:center;gap:20px"><a class="home" href="/market.html">Shop</a></span></div></header>
<main class="wrap page" style="gap:20px">
  <div class="stack-s">
    <div class="mono gold">YOUR ACCOUNT</div>
    <h1>Messages</h1>
    <div class="small">Questions to sellers, and buyers' questions to your shop. You get an email when someone writes back.</div>
  </div>
  <div id="signin" hidden></div>
  <div class="mg" id="mg" hidden>
    <div class="mg-list" id="list"></div>
    <div class="mg-thread" id="thread"><div class="small dim">Pick a conversation.</div></div>
  </div>
</main>
<script src="/jf.js"></script>
<script>
(function () {
  var el = function (t, x, c) { var e = document.createElement(t); if (x != null) e.textContent = x; if (c) e.className = c; return e; };
  var $ = function (id) { return document.getElementById(id); };
  var qs = new URLSearchParams(location.search), tok = JF.token(), cur = null, poll = null, threads = [];
  var when = function (t) { var d = new Date(t), now = new Date(); return d.toDateString() === now.toDateString() ? d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); };
  function start() {
    if (!tok) { var b = $('signin'); b.hidden = false; JF.signInBox(b, 'Sign in, or create a free account, to message sellers.', function (t) { tok = t; b.hidden = true; start(); }); return; }
    $('mg').hidden = false;
    loadList().then(function () {
      if (qs.get('t')) openThread(qs.get('t'));
      else if (qs.get('to')) compose(qs.get('to'), qs.get('pid') || '');
    });
  }
  function loadList() {
    return JF.api('/api/market?do=msg-inbox&t=' + encodeURIComponent(tok)).then(function (r) {
      if (r._status === 401) { JF.signOut(); tok = ''; $('mg').hidden = true; start(); return; }
      threads = r.threads || []; drawList();
    });
  }
  function drawList() {
    var L = $('list'); L.textContent = '';
    if (!threads.length) { L.appendChild(el('div', 'No messages yet. Tap "Ask the seller a question" on any piece to start one.', 'small dim')); return; }
    threads.forEach(function (t) {
      var b = el('button', null, 'mg-item' + (cur && cur.id === t.id ? ' on' : '')); b.type = 'button';
      var top = el('div', null, 'top'); top.appendChild(el('b', t.side === 'b' ? t.sellerName : t.buyerName));
      if (t.unread) top.appendChild(el('span', String(t.unread), 'mg-dot')); else if (t.last) top.appendChild(el('span', when(t.last.at), 'small dim'));
      b.appendChild(top);
      b.appendChild(el('span', t.side === 'b' ? 'YOU ASKED A SELLER' : 'A BUYER ASKED YOUR SHOP', 'mg-tag'));
      if (t.product) b.appendChild(el('span', t.product, 'small'));
      if (t.last) b.appendChild(el('span', (t.last.from === t.side ? 'You: ' : '') + t.last.text, 'pv'));
      b.addEventListener('click', function () { openThread(t.id); });
      L.appendChild(b);
    });
  }
  // The conversation: who it is with, the piece it is about (photo and name), the messages, and a reply bar.
  function frame(title, sub, links, pid) {
    var T = $('thread'); T.textContent = ''; $('mg').classList.add('open');
    var hd = el('div', null, 'mg-head'), who = el('div', null, 'mg-who');
    var back = el('button', '‹', 'ghost mg-back'); back.type = 'button'; back.title = 'All messages'; back.style.cssText = 'padding:4px 12px;min-height:0;font-size:20px'; back.addEventListener('click', function () { $('mg').classList.remove('open'); cur = null; stop(); history.replaceState(null, '', '/messages.html'); drawList(); });
    who.appendChild(back); who.appendChild(el('div', (title || '?').trim().charAt(0).toUpperCase(), 'mg-av'));
    var nm = el('div'); nm.style.minWidth = '0'; nm.appendChild(el('div', title, 'nm')); if (sub) nm.appendChild(el('div', sub, 'small dim')); who.appendChild(nm);
    hd.appendChild(who);
    var r = el('div', null, 'mg-links'); (links || []).forEach(function (x) { var a = el('a', x[0]); a.href = x[1]; r.appendChild(a); }); hd.appendChild(r);
    T.appendChild(hd);
    if (pid) {
      var pc = el('a', null, 'mg-piece'); pc.href = '/order.html?product=' + encodeURIComponent(pid); pc.hidden = true; T.appendChild(pc);
      fetch('/api/market?do=item&id=' + encodeURIComponent(pid), { cache: 'no-store' }).then(function (x) { return x.ok ? x.json() : null; }).then(function (p) {
        if (!p) return; pc.hidden = false;
        if (p.photo) { var im = el('img'); im.src = p.photo; im.alt = ''; pc.appendChild(im); } else pc.appendChild(el('div', null, 'ph'));
        var tx = el('div', null, 'tx'); tx.appendChild(el('b', p.name)); tx.appendChild(el('span', '$' + p.price + (p.left > 0 ? ' · ' + p.left + ' available' : ' · sold out'), 'small dim')); pc.appendChild(tx);
      }).catch(function () {});
    }
    var box = el('div', null, 'mg-msgs'); T.appendChild(box);
    var f = el('form', null, 'mg-say'), ta = el('textarea'), go = el('button', '➤', 'solid'); go.type = 'submit'; go.title = 'Send'; go.setAttribute('aria-label', 'Send'); ta.maxLength = 1500; ta.rows = 1; ta.placeholder = 'Write a message…';
    var grow = function () { ta.style.height = '46px'; ta.style.height = Math.min(140, ta.scrollHeight + 2) + 'px'; };
    ta.addEventListener('input', grow);
    f.appendChild(ta); f.appendChild(go); T.appendChild(f);
    var m = el('div', '', 'small mg-status'); m.setAttribute('role', 'status'); T.appendChild(m);
    ta.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' && !ev.shiftKey && window.innerWidth > 760) { ev.preventDefault(); f.requestSubmit ? f.requestSubmit() : go.click(); } });
    return { box: box, form: f, ta: ta, go: go, msg: m };
  }
  function drawMsgs(box, t) {
    var atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
    box.textContent = '';
    t.msgs.forEach(function (x) { var b = el('div', null, 'mg-b ' + (x.from === t.side ? 'me' : 'them')); b.appendChild(document.createTextNode(x.text)); b.appendChild(el('div', when(x.at), 'mg-t')); box.appendChild(b); });
    if (atEnd || !box.dataset.seen) { box.scrollTop = box.scrollHeight; box.dataset.seen = '1'; }
  }
  function stop() { if (poll) { clearInterval(poll); poll = null; } }
  function openThread(id) {
    stop();
    JF.api('/api/market?do=msg-open&t=' + encodeURIComponent(tok) + '&id=' + encodeURIComponent(id)).then(function (r) {
      if (r.error) { $('thread').textContent = r.error; return; }
      var t = r.thread; cur = t; history.replaceState(null, '', '/messages.html?t=' + encodeURIComponent(t.id));
      var links = t.side === 'b' ? [['Visit shop', '/shop.html?s=' + encodeURIComponent(t.seller)]] : [];
      var F = frame(t.side === 'b' ? t.sellerName : t.buyerName, t.side === 'b' ? 'Seller' : 'Buyer asking about your piece', links, t.pid);
      drawMsgs(F.box, t);
      F.form.addEventListener('submit', function (ev) { ev.preventDefault(); send(F, { id: t.id }); });
      threads.forEach(function (x) { if (x.id === t.id) x.unread = 0; }); drawList();
      poll = setInterval(function () { if (document.hidden || !cur || cur.id !== t.id) return; JF.api('/api/market?do=msg-open&t=' + encodeURIComponent(tok) + '&id=' + encodeURIComponent(t.id)).then(function (r2) { if (r2.thread && r2.thread.msgs.length !== cur.msgs.length) { cur = r2.thread; drawMsgs(F.box, cur); } }); }, 8000);
    });
  }
  // A new question to a shop, about one of its pieces if there is one.
  function compose(slug, pid) {
    var have = threads.filter(function (x) { return x.side === 'b' && x.seller === slug && x.pid === pid; })[0];
    if (have) { openThread(have.id); return; }
    JF.api('/api/market?do=shop&seller=' + encodeURIComponent(slug)).then(function (r) {
      var shop = r.seller, p = (r.products || []).filter(function (x) { return x.id === pid; })[0];
      if (!shop) { $('thread').textContent = 'That shop was not found.'; $('mg').classList.add('open'); return; }
      var F = frame(shop.name, 'Seller', [['Visit shop', '/shop.html?s=' + encodeURIComponent(slug)]], p ? pid : '');
      F.box.appendChild(el('div', '💬 Ask anything: condition, which cover or version it is, more photos, shipping. ' + shop.name + ' gets an email and replies here.', 'mg-hint'));
      F.ta.placeholder = p ? 'e.g. Is this ' + p.name + ' a cover A or a blind bag?' : 'Write your question…';
      setTimeout(function () { F.ta.focus(); }, 100);
      F.form.addEventListener('submit', function (ev) { ev.preventDefault(); send(F, { seller: slug, pid: p ? pid : '' }); });
    });
  }
  function send(F, extra) {
    var text = F.ta.value.trim(); if (!text) return;
    F.go.disabled = true; F.msg.textContent = 'Sending…';
    JF.api('/api/market', Object.assign({ do: 'msg-send', t: tok, text: text }, extra)).then(function (r) {
      F.go.disabled = false;
      if (r.error) { F.msg.textContent = r.error; return; }
      F.ta.value = ''; F.msg.textContent = '';
      var first = !extra.id; cur = r.thread;
      if (first) { loadList().then(function () { openThread(r.thread.id); }); return; }
      drawMsgs(F.box, cur); F.box.scrollTop = F.box.scrollHeight;
      loadList();
    });
  }
  start();
})();
</script>
</body>
</html>
