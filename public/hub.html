<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>My V2V</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:wght@600;700;800&display=swap">
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/market.css">
<style>
  .hb{max-width:640px;margin:0 auto;padding:12px 16px 110px;display:flex;flex-direction:column;gap:6px}
  .hb-me{display:flex;align-items:center;gap:12px;padding:6px 0 12px}
  .hb-av{width:46px;height:46px;border-radius:50%;background:#C9A45C;color:#0B1712;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:21px;flex:none}
  .hb-me b{display:block;font-size:18px}.hb-me span{font-size:13px;opacity:.7}
  .hb-cart{margin-left:auto;width:42px;height:42px;border-radius:50%;background:#11261C;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:19px}
  .hb-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
  .hb-tile{position:relative;background:#11261C;border-radius:14px;padding:16px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:#F7F2E6;font-size:14px;border:0;cursor:pointer;font:inherit;min-height:0}
  .hb-tile i{font-style:normal;font-size:22px}
  .hb-dot{position:absolute;top:8px;right:18%;background:#E5484D;color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;font-weight:900}
  .hb h2{font-size:21px;margin:16px 0 2px}
  .hb-sec{display:flex;flex-direction:column;border-bottom:1px solid #2E4A3B;padding-bottom:10px}
  .hb-row{display:flex;align-items:center;gap:14px;padding:9px 0;text-decoration:none;color:#F7F2E6;background:none;border:0;font:inherit;text-align:left;cursor:pointer;min-height:0}
  .hb-row i{font-style:normal;width:40px;height:40px;border-radius:50%;background:#11261C;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
  .hb-row b{font-weight:500;font-size:16px;display:block}.hb-row small{display:block;font-size:13px;opacity:.65}
  .hb-row small.red{color:#FF6B6B;opacity:1}
  .hb-new{font-size:10px;font-weight:800;border:1px solid #3FB950;color:#3FB950;border-radius:99px;padding:0 6px;margin-left:6px;vertical-align:2px}
  .hb-plain{padding:11px 0;text-decoration:none;color:#F7F2E6;font-size:16px;background:none;border:0;font:inherit;text-align:left;cursor:pointer;min-height:0}
</style>
</head>
<body>
<header class="top"><div class="wrap bar"><a class="brand" href="/" style="text-decoration:none">V2V</a><span style="display:flex;align-items:center;gap:20px"><span class="mono dim">MY V2V</span><a class="home" href="/market.html">Market</a></span></div></header>
<main class="hb" id="hb"><div class="small">Loading...</div></main>
<script src="/jf.js"></script>
<script>
(function () {
  var hb = document.getElementById('hb'), el = JF.el, tok = JF.token();
  if (!tok) { location.replace('/me.html?next=' + encodeURIComponent('/hub.html')); return; }
  function row(sec, icon, title, sub, href, red) {
    var a = el(typeof href === 'function' ? 'button' : 'a', null, 'hb-row'); if (typeof href === 'function') { a.type = 'button'; a.onclick = href; } else a.href = href;
    a.appendChild(el('i', icon)); var t = el('span'); var b = el('b', title); t.appendChild(b); if (sub) t.appendChild(el('small', sub, red ? 'red' : '')); a.appendChild(t); sec.appendChild(a); return b;
  }
  function section(name) { hb.appendChild(el('h2', name)); var s = el('div', null, 'hb-sec'); hb.appendChild(s); return s; }
  function plain(sec, text, href) { var a = el(typeof href === 'function' ? 'button' : 'a', text, 'hb-plain'); if (typeof href === 'function') { a.type = 'button'; a.onclick = href; } else a.href = href; sec.appendChild(a); }
  Promise.all([JF.api('/api/me?t=' + encodeURIComponent(tok)), fetch('/api/market?do=notify&t=' + encodeURIComponent(tok), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : { items: [] }; }).catch(function () { return { items: [] }; })]).then(function (x) {
    var D = x[0], N = x[1] || { items: [] };
    if (D._status === 401) { JF.signOut(); location.replace('/me.html'); return; }
    if (D.error) { hb.textContent = D.error; return; }
    var cnt = function (re) { return (N.items || []).filter(function (i) { return re.test(i.link + ' ' + i.text); }).reduce(function (a, i) { return a + i.n; }, 0); };
    var msgs = cnt(/messages\.html/), offB = cnt(/me\.html#offers/), offS = cnt(/seller\.html#offers/), ship = cnt(/Paid order to ship|Send NFT/), owe = (N.items || []).filter(function (i) { return /#owe/.test(i.link); })[0];
    var S = D.seller;
    hb.textContent = '';
    var me = el('div', null, 'hb-me'); me.appendChild(el('div', (D.name || D.email).charAt(0).toUpperCase(), 'hb-av'));
    var nm = el('div'); nm.appendChild(el('b', S ? S.name : (D.name || D.email.split('@')[0]))); nm.appendChild(el('span', S ? 'Seller · veefam.io/' + S.slug : D.email)); me.appendChild(nm);
    var cart = el('a', '🛒', 'hb-cart'); cart.href = '/cart.html'; cart.setAttribute('aria-label', 'Cart'); me.appendChild(cart); hb.appendChild(me);
    var tiles = el('div', null, 'hb-tiles');
    [['💳', 'Payments', S ? '/seller.html#payouts' : '/me.html', 0], ['🔔', 'Notifications', function () { var b = document.querySelector('.jfn-bell'); if (b) { window.scrollTo(0, 0); setTimeout(function () { b.click(); }, 50); } }, N.total || 0], ['✉️', 'Messages', '/messages.html', msgs]].forEach(function (t) {
      var a = el(typeof t[2] === 'function' ? 'button' : 'a', null, 'hb-tile'); if (typeof t[2] === 'function') { a.type = 'button'; a.onclick = t[2]; } else a.href = t[2];
      a.appendChild(el('i', t[0])); a.appendChild(el('span', t[1])); if (t[3]) a.appendChild(el('b', t[3] > 99 ? '99+' : String(t[3]), 'hb-dot')); tiles.appendChild(a);
    });
    hb.appendChild(tiles);
    var sh = section('Shopping');
    row(sh, '♡', 'Wishlist', 'Pieces you saved', '/wishlist.html');
    row(sh, '📦', 'Purchases', 'Your order history and tracking', '/account.html');
    row(sh, '🤝', 'Bids & offers', offB ? offB + ' offer' + (offB > 1 ? 's' : '') + ' to pay for' : 'Offers you made', '/me.html#offers', !!offB);
    row(sh, '⚙️', 'Buyer settings', 'Address, saved cards, how you pay', '/me.html');
    var se = section('Selling');
    if (S) {
      row(se, '＋', 'List an item', 'Photo, price, shipping', '/seller.html#add');
      row(se, '🗂️', 'Bulk list', 'Many pieces at once', '/seller.html#bulk');
      row(se, '🏷️', 'Selling overview', 'Manage your listings and sales', '/seller.html');
      row(se, '🚚', 'Orders', ship ? ship + ' to ship' : 'Ship and track your sales', '/seller.html#orders', !!ship);
      row(se, '💬', 'Offers & trades', offS ? offS + ' offer' + (offS > 1 ? 's' : '') + ' to review' : 'Answer buyers', '/seller.html#offers', !!offS);
      row(se, '🧾', 'What you owe', owe ? owe.text : 'Fees and labels', '/seller.html#owe', !!owe);
      row(se, '🏪', 'My shop page', 'See it like a buyer', '/shop.html?s=' + encodeURIComponent(S.slug));
    } else row(se, '＋', 'Start selling', 'Open your shop in a minute', '/seller.html');
    var sc = section('Shortcuts');
    row(sc, '🔴', 'Live shows', 'Watch and bid live', '/live.html');
    row(sc, '⏱️', 'Auctions', 'Ending soon', '/market.html?view=auctions');
    row(sc, '📈', 'Sold prices', 'What pieces really sell for', '/sold.html');
    row(sc, '🎁', 'Giveaway and vote', 'Community wallet', '/giveaway.html');
    if (S) row(sc, '🎓', 'Learn features', 'Tour of the Seller Hub', '/seller.html#tour');
    var ac = section('Account');
    plain(ac, 'Two-step sign-in', S ? '/seller.html#settings' : '/account.html');
    if (S) plain(ac, 'Shop settings', '/seller.html#settings');
    plain(ac, 'Help', '/help.html');
    plain(ac, 'Terms of Service', '/terms.html');
    plain(ac, 'Sign out', function () { JF.signOut(); location.href = '/'; });
  });
})();
</script>
</body>
</html>
