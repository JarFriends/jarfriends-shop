<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live shows · V2V</title>
<meta name="description" content="Live VeeFriends shows on V2V: watch, chat and bid in real time.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:wght@600;700;800&display=swap">
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/market.css">
<style>
.lv-wrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:16px;align-items:start}
@media(max-width:860px){.lv-wrap{grid-template-columns:1fr}}
.lv-video{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:16/9}
.lv-video video{background:#000}
.lv-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.lv-off{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;height:100%;padding:20px;text-align:center;color:#D6E2DA}
.lv-badge{display:inline-flex;align-items:center;gap:6px;background:#E5484D;color:#fff;font:800 12px/1 Archivo,sans-serif;letter-spacing:.08em;padding:5px 9px;border-radius:4px}
.lv-badge:before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:lvp 1.2s infinite}
@keyframes lvp{50%{opacity:.3}}
.lv-panel{display:flex;flex-direction:column;gap:12px}
.lv-lot{border:2px solid #C9A45C;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;background:rgba(201,164,92,.06)}
.lv-lot-top{display:flex;gap:12px;align-items:center}
.lv-lot-top img{width:78px;height:78px;object-fit:cover;border-radius:6px;flex:none;background:#11261C}
.lv-price{font:800 32px/1 "IBM Plex Mono",monospace;color:#C9A45C}
.lv-timer{font:800 28px/1 "IBM Plex Mono",monospace}
.lv-timer.hot{color:#E5484D}
.lv-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lv-bids{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.lv-bids button{min-height:54px;font-size:17px;font-weight:800}
.lv-sold{background:#1F4D36;border-radius:8px;padding:12px;font-weight:800;text-align:center;font-size:18px}
.lv-chat{border:1px solid #244536;border-radius:10px;display:flex;flex-direction:column;height:300px}
.lv-msgs{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.lv-msgs b{color:#C9A45C;margin-right:6px}
.lv-say{display:flex;gap:6px;border-top:1px solid #244536;padding:8px}
.lv-say input{flex:1;min-width:0;min-height:42px;font-size:16px}
.lv-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.lv-card{border:1px solid #244536;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit}
.lv-card:hover{border-color:#C9A45C}
.lv-past{display:flex;flex-direction:column;gap:6px;font-size:14px}
.lv-deal{border:2px solid #E5484D;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;background:rgba(229,72,77,.07)}
.lv-deal h3{margin:0;font-size:14px;letter-spacing:.08em;color:#FF8A8E}
.lv-was{position:relative;display:inline-block;font:700 20px/1 "IBM Plex Mono",monospace;opacity:.6;margin-right:10px}
.lv-was:after{content:"";position:absolute;left:-2px;top:50%;height:3px;width:0;background:#E5484D;transform:rotate(-8deg);animation:lvStrike .5s ease-out forwards}
@keyframes lvStrike{to{width:calc(100% + 4px)}}
.lv-now{display:inline-block;font:800 34px/1 "IBM Plex Mono",monospace;color:#C9A45C}
.lv-now.pop{animation:lvPop .6s ease-out}
@keyframes lvPop{0%{transform:scale(1.5);color:#7DD3B0}100%{transform:scale(1)}}
.lv-meter{height:8px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}.lv-meter span{display:block;height:100%;background:linear-gradient(90deg,#C9A45C,#E5484D);transition:width .5s}
.lv-won{background:#C9A45C;color:#0B1A13;border-radius:8px;padding:12px;font-weight:800;display:flex;flex-direction:column;gap:8px}
.lv-won a{color:#0B1A13;background:#0B1A13;color:#F7F2E6;padding:10px 14px;border-radius:6px;text-align:center;text-decoration:none}
</style>
</head>
<body>
<header class="top"><div class="wrap bar"><a class="brand" href="/" style="text-decoration:none">V2V</a><span style="display:flex;align-items:center;gap:20px"><span class="mono dim">LIVE</span><a class="home" href="/">Shop</a></span></div></header>
<main class="wrap page" id="main" style="gap:18px"><p class="dim">Loading…</p></main>
<script src="/jf.js"></script>
<script>
// Live shows. /live.html lists who is live and who is coming up; /live.html?s=<shop> is one show: the seller's
// stream next to the piece that is up, its countdown, bid buttons and the chat. It checks for news every 2 seconds.
(function () {
  var $ = function (id) { return document.getElementById(id); }, el = JF.el, tok = JF.token(), main = $('main');
  var slug = (new URLSearchParams(location.search).get('s') || '').toLowerCase();
  var usd = function (c) { return '$' + (c / 100).toLocaleString('en-US', { minimumFractionDigits: c % 100 ? 2 : 0, maximumFractionDigits: 2 }); };
  var when = function (t) { return new Date(t).toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); };
  if (!slug) return listShows();

  function listShows() {
    main.textContent = '';
    main.appendChild(el('h1', 'Live shows'));
    main.appendChild(el('div', 'Sellers go live, put up pieces one at a time, and the top bid when the clock hits zero wins. Join in, chat and bid.', 'small'));
    var box = el('div', 'Loading…', 'lv-list'); main.appendChild(box);
    JF.api('/api/market?do=live').then(function (r) {
      box.textContent = '';
      if (!r.shows || !r.shows.length) { box.appendChild(el('div', 'Nobody is live right now. Check back soon, or subscribe at the top for news about shows.', 'small dim')); return; }
      r.shows.forEach(function (s) {
        var a = el('a', null, 'lv-card'); a.href = '/live.html?s=' + encodeURIComponent(s.slug);
        var top = el('div', null, 'lv-row');
        if (s.status === 'live') top.appendChild(el('span', 'LIVE', 'lv-badge')); else top.appendChild(el('span', 'Starts ' + when(s.startsAt), 'small gold'));
        a.appendChild(top); a.appendChild(el('b', s.title || s.shop)); a.appendChild(el('span', 'by ' + s.shop, 'small dim'));
        if (s.lot) a.appendChild(el('span', 'Up now: ' + s.lot.name, 'small'));
        box.appendChild(a);
      });
    });
  }

  // ---- One show ----
  var D = null, skew = 0, lotId = '', lastChat = 0, busy = false;
  main.textContent = '';
  var head = el('div', null, 'lv-row'); var h1 = el('h1', ''); h1.style.margin = '0'; head.appendChild(h1); main.appendChild(head);
  var wrap = el('div', null, 'lv-wrap'); main.appendChild(wrap);
  var video = el('div', null, 'lv-video'); var left = el('div'); left.style.cssText = 'display:flex;flex-direction:column;gap:10px'; left.appendChild(video);
  var past = el('div', null, 'lv-past'); left.appendChild(past); wrap.appendChild(left);
  setTimeout(function () { left.appendChild(clipsBox); loadClips(); }, 0);
  var panel = el('div', null, 'lv-panel'); wrap.appendChild(panel);
  var wonBox = el('div'); var dealBox = el('div'); var lotBox = el('div'); var dealKey = ''; var msg = el('div', '', 'small'); msg.setAttribute('role', 'status');
  var chat = el('div', null, 'lv-chat'), msgs = el('div', null, 'lv-msgs'), say = el('form', null, 'lv-say'), sayIn = el('input'), sayGo = el('button', 'Send', 'solid');
  sayIn.placeholder = tok ? 'Say something…' : 'Sign in to chat'; sayIn.maxLength = 200; sayGo.type = 'submit'; say.appendChild(sayIn); say.appendChild(sayGo); chat.appendChild(msgs); chat.appendChild(say);
  [wonBox, dealBox, lotBox, msg, chat].forEach(function (n) { panel.appendChild(n); });
  var streamKey = '';
  function drawVideo() {
    var st = D.stream || {}, key = st.embed + '|' + st.url + '|' + D.status;
    if (key === streamKey) return; streamKey = key; video.textContent = '';
    if (D.status === 'live' && st.kind === 'camera') { watchCam(); return; }
    if (D.status === 'live' && st.embed) { var f = el('iframe'); f.src = st.embed; f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen'; f.allowFullscreen = true; f.title = 'Live stream'; video.appendChild(f); if (!document.getElementById('lvTip')) { var tip = el('div', 'To clip this stream, use the Clip button on ' + (st.kind === 'twitch' ? 'Twitch' : 'YouTube') + '.', 'small dim'); tip.id = 'lvTip'; video.parentNode.insertBefore(tip, video.nextSibling); } return; }
    var off = el('div', null, 'lv-off');
    if (D.status === 'live' && st.url) {
      off.appendChild(el('b', 'The stream is on ' + ({ tiktok: 'TikTok', instagram: 'Instagram', facebook: 'Facebook', youtube: 'YouTube', twitch: 'Twitch' }[st.kind] || 'another site') + '.'));
      off.appendChild(el('span', 'Open it to watch, and keep this page open to bid and chat.', 'small'));
      var a = el('a', 'Watch the stream ↗', 'solid'); a.href = st.url; a.target = '_blank'; a.rel = 'noopener'; a.style.textDecoration = 'none'; off.appendChild(a);
    } else if (D.status === 'scheduled') off.appendChild(el('b', 'This show starts ' + when(D.startsAt) + '.'));
    else off.appendChild(el('b', 'This show has ended. Thanks for watching!'));
    video.appendChild(off);
  }
  // The seller is live from the site itself (LiveKit): join the show's room as a viewer and play their camera.
  var room = null, live = {};
  // Clips: record up to 25 seconds of the live video in this browser, then post it to the show, save it or share it.
  var clipBtn = el('button', '✂️ Clip', 'solid'); clipBtn.type = 'button'; clipBtn.hidden = true; clipBtn.style.cssText = 'position:absolute;right:10px;bottom:10px;z-index:3';
  var rec = null, recParts = [], recStart = 0, recTimer = null, MAXS = 25;
  clipBtn.addEventListener('click', function () {
    if (rec) { rec.stop(); return; }
    if (!tok) { location.href = '/me.html'; return; }
    if (!window.MediaRecorder || !live.video) { msg.textContent = 'Your browser cannot record clips. Try Chrome or Safari.'; return; }
    var tracks = [live.video]; if (live.audio) tracks.push(live.audio);
    var type = ['video/mp4;codecs=avc1,mp4a', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].filter(function (t) { return MediaRecorder.isTypeSupported(t); })[0] || '';
    try { rec = new MediaRecorder(new MediaStream(tracks), { mimeType: type, videoBitsPerSecond: 700000, audioBitsPerSecond: 64000 }); } catch (e) { msg.textContent = 'Recording did not start in this browser.'; return; }
    recParts = []; recStart = Date.now();
    rec.ondataavailable = function (ev) { if (ev.data && ev.data.size) recParts.push(ev.data); };
    rec.onstop = function () { clearInterval(recTimer); var secs = Math.round((Date.now() - recStart) / 1000); var blob = new Blob(recParts, { type: rec.mimeType || type || 'video/webm' }); rec = null; clipBtn.textContent = '✂️ Clip'; review(blob, secs); };
    rec.start(1000);
    recTimer = setInterval(function () { var t = Math.round((Date.now() - recStart) / 1000); clipBtn.textContent = '■ Stop (' + (MAXS - t) + 's)'; if (t >= MAXS && rec) rec.stop(); }, 250);
    clipBtn.textContent = '■ Stop (' + MAXS + 's)';
  });
  function review(blob, secs) {
    var bg = el('div'); bg.style.cssText = 'position:fixed;inset:0;z-index:2147483600;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:16px';
    var box = el('div', null, 'card'); box.style.cssText = 'max-width:460px;width:100%;gap:10px;display:flex;flex-direction:column';
    box.appendChild(el('b', 'Your clip (' + secs + 's)'));
    var v = el('video'); v.src = URL.createObjectURL(blob); v.controls = true; v.playsInline = true; v.autoplay = true; v.muted = true; v.style.cssText = 'width:100%;border-radius:8px;background:#000'; box.appendChild(v);
    var ti = el('input'); ti.placeholder = 'Give it a title (optional)'; ti.maxLength = 80; box.appendChild(ti);
    var row = el('div'); row.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px';
    var post = el('button', 'Post to the show', 'solid'), save = el('a', 'Save to my device', 'ghost'), x = el('button', 'Close', 'ghost'); post.type = x.type = 'button';
    var ext = /mp4/.test(blob.type) ? 'mp4' : 'webm'; save.href = v.src; save.download = 'v2v-clip.' + ext; save.style.cssText = 'text-decoration:none;padding:10px 14px';
    [post, save, x].forEach(function (n) { row.appendChild(n); }); box.appendChild(row);
    var m = el('div', '', 'small'); box.appendChild(m);
    x.addEventListener('click', function () { bg.remove(); });
    post.addEventListener('click', function () {
      if (blob.size > 3200000) { m.textContent = 'That clip is too big to post. Save it to your device instead, or record a shorter one.'; return; }
      post.disabled = true; m.textContent = 'Posting…';
      var fr = new FileReader(); fr.onload = function () {
        JF.api('/api/market', { do: 'clip-add', t: tok, s: slug, data: fr.result, type: blob.type, secs: secs, title: ti.value }).then(function (r) {
          if (r.error) { post.disabled = false; m.textContent = r.error; return; }
          var link = location.origin + '/live.html?s=' + encodeURIComponent(slug) + '&clip=' + r.clip.id;
          m.textContent = 'Posted! '; var sh = el('button', navigator.share ? 'Share it' : 'Copy link', 'ghost'); sh.type = 'button';
          sh.addEventListener('click', function () { if (navigator.share) navigator.share({ title: ti.value || 'V2V live clip', url: link }).catch(function () {}); else { try { navigator.clipboard.writeText(link); sh.textContent = 'Copied!'; } catch (e) { prompt('Copy this link:', link); } } });
          m.appendChild(sh); loadClips();
        });
      }; fr.readAsDataURL(blob);
    });
    bg.appendChild(box); document.body.appendChild(bg);
  }
  // The show's clips, under the video. ?clip=<id> opens straight to one.
  var clipsBox = el('div'); clipsBox.style.cssText = 'display:flex;flex-direction:column;gap:8px'; var wantClip = new URLSearchParams(location.search).get('clip') || '';
  function loadClips() {
    JF.api('/api/market?do=clips&s=' + encodeURIComponent(slug)).then(function (r) {
      clipsBox.textContent = ''; var list = r.clips || []; if (!list.length) return;
      clipsBox.appendChild(el('b', '✂️ Clips from this show'));
      var g = el('div'); g.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px';
      list.forEach(function (c) {
        var w = el('div'); w.style.cssText = 'display:flex;flex-direction:column;gap:4px';
        var v = el('video'); v.src = c.url; v.controls = true; v.playsInline = true; v.preload = 'metadata'; v.style.cssText = 'width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:8px;background:#000';
        w.appendChild(v); w.appendChild(el('span', (c.title || 'Clip') + ' · @' + c.byName, 'small dim')); g.appendChild(w);
        if (c.id === wantClip) { wantClip = ''; setTimeout(function () { w.scrollIntoView({ behavior: 'smooth', block: 'center' }); v.play().catch(function () {}); }, 400); }
      });
      clipsBox.appendChild(g);
    }).catch(function () {});
  }
  function lkLoad() { return window.LivekitClient ? Promise.resolve() : new Promise(function (ok, no) { var sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/livekit-client@2.15.0/dist/livekit-client.umd.js'; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); }); }
  function watchCam() {
    video.appendChild(clipBtn);
    var off = el('div', null, 'lv-off'); off.appendChild(el('b', 'Connecting to the live video…')); video.appendChild(off);
    Promise.all([lkLoad(), JF.api('/api/market?do=show-token&s=' + encodeURIComponent(slug))]).then(function (x) {
      var r = x[1]; if (r.error) { off.textContent = r.error; return; }
      var LK = window.LivekitClient; room = new LK.Room({ adaptiveStream: true });
      room.on(LK.RoomEvent.TrackSubscribed, function (track) {
        live[track.kind] = track.mediaStreamTrack; clipBtn.hidden = !live.video;
        var m = track.attach(); if (track.kind === 'video') { off.remove(); m.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000'; m.playsInline = true; video.appendChild(m); } else { m.style.display = 'none'; video.appendChild(m); }
      });
      room.on(LK.RoomEvent.TrackUnsubscribed, function (track) { track.detach().forEach(function (n) { n.remove(); }); });
      room.on(LK.RoomEvent.AudioPlaybackStatusChanged, function () { sound.hidden = room.canPlaybackAudio; });
      var sound = el('button', '🔊 Tap for sound', 'solid'); sound.type = 'button'; sound.style.cssText = 'position:absolute;left:10px;bottom:10px;z-index:2'; sound.hidden = true;
      sound.addEventListener('click', function () { room.startAudio().then(function () { sound.hidden = true; }); }); video.appendChild(sound);
      return room.connect(r.url, r.token).then(function () { sound.hidden = room.canPlaybackAudio; if (!room.remoteParticipants.size) off.textContent = 'The seller is getting their camera ready…'; });
    }).catch(function () { off.textContent = 'The live video did not load. Refresh to try again.'; });
  }
  var timerEl = null, priceEl = null, bidBtns = [];
  function drawLot() {
    lotBox.textContent = ''; timerEl = null; bidBtns = [];
    var L = D.lot;
    if (!L) {
      var last = D.sold[0];
      if (last && Date.now() - last.at < 15000) lotBox.appendChild(el('div', last.price ? '🎉 SOLD to @' + last.byName + ' for ' + usd(last.price) : 'No bids. ' + last.name + ' passed.', 'lv-sold'));
      else lotBox.appendChild(el('div', D.status === 'live' ? 'Waiting for the next piece…' : '', 'small dim'));
      return;
    }
    var c = el('div', null, 'lv-lot');
    var top = el('div', null, 'lv-lot-top');
    if (L.photo) { var im = el('img'); im.src = L.photo; im.alt = ''; top.appendChild(im); }
    var t = el('div'); t.appendChild(el('b', L.name)); if (L.desc) t.appendChild(el('div', L.desc.slice(0, 120), 'small dim')); top.appendChild(t); c.appendChild(top);
    var row = el('div', null, 'lv-row');
    var pr = el('div'); pr.appendChild(el('div', L.bid ? 'Top bid · @' + L.byName + (L.mine ? ' (you!)' : '') : 'Starting bid', 'small dim')); priceEl = el('div', usd(L.bid || L.start), 'lv-price'); pr.appendChild(priceEl);
    var tm = el('div'); tm.style.textAlign = 'right'; tm.appendChild(el('div', L.n + (L.n === 1 ? ' bid' : ' bids'), 'small dim')); timerEl = el('div', '', 'lv-timer'); tm.appendChild(timerEl);
    row.appendChild(pr); row.appendChild(tm); c.appendChild(row);
    var bids = el('div', null, 'lv-bids');
    [[L.next, 'Bid ' + usd(L.next)], [L.next + 500, '+$5'], [L.next + 1000, '+$10']].forEach(function (x, i) {
      var b = el('button', x[1], i === 0 ? 'solid' : 'ghost'); b.type = 'button'; b.disabled = L.mine; b.addEventListener('click', function () { place(x[0]); }); bids.appendChild(b); bidBtns.push(b);
    });
    c.appendChild(bids);
    if (L.mine) c.appendChild(el('div', 'You have the top bid. 🙌', 'small gold'));
    if (!tok) { var si = el('a', 'Sign in to bid'); si.href = '/me.html'; c.appendChild(si); }
    lotBox.appendChild(c);
    tick();
  }
  function tick() {
    if (!timerEl || !D.lot) return;
    var left = Math.max(0, Math.ceil((D.lot.endsAt - (Date.now() + skew)) / 1000));
    timerEl.textContent = '0:' + (left < 10 ? '0' : '') + left; if (left > 59) timerEl.textContent = Math.floor(left / 60) + ':' + ('0' + left % 60).slice(-2);
    timerEl.className = 'lv-timer' + (left <= 5 ? ' hot' : '');
    if (left === 0) bidBtns.forEach(function (b) { b.disabled = true; });
  }
  setInterval(tick, 250);
  function drawRest() {
    h1.textContent = D.title || D.shop; if (D.status === 'live' && !head.querySelector('.lv-badge')) head.insertBefore(el('span', 'LIVE', 'lv-badge'), h1);
    document.title = (D.status === 'live' ? '🔴 ' : '') + (D.title || D.shop) + ' · V2V Live';
    past.textContent = '';
    if (D.sold.length) { past.appendChild(el('b', 'Sold this show')); D.sold.forEach(function (x) { past.appendChild(el('div', x.name + ' · ' + (x.price ? usd(x.price) + ' to @' + x.byName : 'no bids'), 'dim')); }); }
    wonBox.textContent = '';
    if (D.won) { var w = el('div', null, 'lv-won'); w.appendChild(el('span', '🎉 You won ' + D.won.name + ' for ' + usd(D.won.price) + '! Pay within 24 hours to claim it.')); var a = el('a', 'Pay now'); a.href = D.won.pay; w.appendChild(a); wonBox.appendChild(w); }
    var newest = D.chat.length ? D.chat[D.chat.length - 1].at : 0;
    if (newest !== lastChat) {
      var atBottom = msgs.scrollTop + msgs.clientHeight >= msgs.scrollHeight - 30;
      msgs.textContent = '';
      if (!D.chat.length) msgs.appendChild(el('div', 'No messages yet. Say hi!', 'dim'));
      D.chat.forEach(function (m) { var d = el('div'); d.appendChild(el('b', m.who)); d.appendChild(document.createTextNode(m.text)); msgs.appendChild(d); });
      if (atBottom || !lastChat) msgs.scrollTop = msgs.scrollHeight; lastChat = newest;
    }
  }
  function load() {
    if (busy) return; busy = true;
    fetch('/api/market?do=show&s=' + encodeURIComponent(slug) + (tok ? '&t=' + encodeURIComponent(tok) : ''), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (r) {
      busy = false;
      if (r.error) { main.textContent = r.error; clearInterval(poll); return; }
      skew = r.now - Date.now();
      var key = r.lot ? r.lot.id + '|' + r.lot.bid + '|' + r.lot.endsAt + '|' + r.lot.mine : 'none|' + (r.sold[0] ? r.sold[0].at : '');
      D = r; drawVideo(); drawRest();
      if (key !== lotId) { lotId = key; drawLot(); }
      var dk = r.deal ? r.deal.id + '|' + r.deal.claimed + '|' + r.deal.mine.length : '';
      if (dk !== dealKey) { var dropped = dealKey && r.deal && dealKey.split('|')[0] === r.deal.id; dealKey = dk; drawDeal(dropped); }
    }).catch(function () { busy = false; });
  }
  // The party deal: the price drops with every buy. The old price gets crossed out and the new one pops in.
  function drawDeal(dropped) {
    dealBox.textContent = ''; var d = D.deal; if (!d) return;
    var c = el('div', null, 'lv-deal');
    c.appendChild(el('h3', '🎉 PARTY DEAL · THE PRICE DROPS EVERY TIME SOMEONE BUYS'));
    var top = el('div', null, 'lv-lot-top');
    if (d.photo) { var im = el('img'); im.src = d.photo; im.alt = ''; top.appendChild(im); }
    var t = el('div'); t.appendChild(el('b', d.name));
    var pr = el('div'); pr.style.marginTop = '6px';
    if (d.prev && d.prev !== d.price) pr.appendChild(el('span', usd(d.prev), 'lv-was'));
    pr.appendChild(el('span', usd(d.price), 'lv-now' + (dropped ? ' pop' : '')));
    t.appendChild(pr); top.appendChild(t); c.appendChild(top);
    var pct = d.start > d.floor ? Math.round((d.start - d.price) * 100 / (d.start - d.floor)) : 100;
    var meter = el('div', null, 'lv-meter'), f = el('span'); f.style.width = pct + '%'; meter.appendChild(f); c.appendChild(meter);
    c.appendChild(el('div', d.claimed + ' bought · ' + d.left + ' left · ' + (d.price > d.floor ? 'next one drops to ' + usd(d.next) : 'lowest price reached!') + ' · started at ' + usd(d.start), 'small'));
    var buy = el('button', d.left ? 'Buy now for ' + usd(d.price) : 'Sold out', 'solid'); buy.type = 'button'; buy.style.minHeight = '54px'; buy.style.fontSize = '18px'; buy.disabled = !d.left;
    buy.addEventListener('click', function () {
      if (!tok) { location.href = '/me.html'; return; }
      buy.disabled = true; msg.textContent = 'Grabbing it…';
      JF.api('/api/market', { do: 'live-claim', t: tok, s: slug }).then(function (r) { msg.textContent = r.error || 'You got it for ' + usd(r.price) + '! Pay within 30 minutes (link below and in your email).'; dealKey = ''; load(); });
    });
    c.appendChild(buy);
    d.mine.forEach(function (x) { var a = el('a', 'Pay ' + usd(x.price) + ' now'); a.href = x.pay; a.className = 'solid'; a.style.cssText = 'text-align:center;text-decoration:none;background:#1F4D36;color:#F7F2E6;padding:10px'; c.appendChild(a); });
    if (d.last.length) c.appendChild(el('div', d.last.map(function (x) { return '@' + x.byName + ' ' + usd(x.price); }).join(' · '), 'small dim'));
    dealBox.appendChild(c);
  }
  function place(amt) {
    if (!tok) { location.href = '/me.html'; return; }
    msg.textContent = 'Placing your bid…'; bidBtns.forEach(function (b) { b.disabled = true; });
    JF.api('/api/market', { do: 'live-bid', t: tok, s: slug, amt: amt }).then(function (r) {
      if (r._status === 401) { JF.signOut(); tok = ''; msg.innerHTML = '<a href="/me.html">Sign in again</a> to bid.'; return; }
      msg.textContent = r.error || 'You are the top bidder at ' + usd(r.bid) + '!';
      lotId = ''; load();
    });
  }
  say.addEventListener('submit', function (ev) {
    ev.preventDefault(); if (!tok) { location.href = '/me.html'; return; }
    var t = sayIn.value.trim(); if (!t) return; sayIn.value = '';
    JF.api('/api/market', { do: 'live-chat', t: tok, s: slug, text: t }).then(function (r) { if (r.error) msg.textContent = r.error; load(); });
  });
  load(); var poll = setInterval(function () { if (!document.hidden) load(); }, 2000);
})();
