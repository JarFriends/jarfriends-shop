<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>My orders</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:wght@600;700;800&display=swap">
<link rel="stylesheet" href="/site.css">
<style>
.order{gap:14px}
.ohead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start}
.stat{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.06em;background:#C9A45C;color:#101726;padding:6px 12px;font-weight:500}
.list{display:flex;flex-direction:column;gap:16px;max-width:760px}
</style>
</head>
<body>
<header class="top"><div class="wrap bar"><a class="brand" href="/" style="text-decoration:none">Collectors Page</a><span style="display:flex;align-items:center;gap:20px"><span class="mono dim">MY ORDERS</span><a class="home" href="/">Home</a></span></div></header>
<main class="wrap page">
  <div class="stack-s">
    <div class="mono gold" id="who">YOUR ACCOUNT</div>
    <h1 id="head">My orders</h1>
    <div class="small" id="lead">Sign in with the email you used to order, to see your orders and their status. Any email works: we send you a sign-in link.</div>
  </div>

  <section class="card" id="signin" hidden style="gap:18px">
    <form id="mailForm" style="display:flex;flex-direction:column;gap:10px;align-items:flex-start">
      <label style="width:100%;display:flex;flex-direction:column;gap:6px">The email you ordered with<input type="email" id="mailIn" required autocomplete="email" placeholder="you@example.com"></label>
      <button class="solid" type="submit" id="mailGo">Email me a sign-in link</button>
    </form>
    <div class="small dim">Or, if you ordered with a Gmail address:</div>
    <div id="gbtn"></div>
    <div class="small" id="msg" role="status"></div>
  </section>

  <div class="list" id="list" hidden></div>
  <div id="foot" hidden style="display:flex;flex-wrap:wrap;gap:10px">
    <a class="solid" href="/order.html" style="text-decoration:none;display:inline-flex;align-items:center">Place a new order</a>
    <button type="button" class="ghost" id="out">Sign out</button>
  </div>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var KEY = 'acct_token', token = null;
  var qs = new URLSearchParams(location.search);
  try {
    var nx = qs.get('next') || '';
    if (qs.get('t')) {
      localStorage.setItem(KEY, qs.get('t'));
      // Signed in from an emailed link that was asked for on another page (the Customer Loyalty safe): go back there.
      if (/^\/[^\/]/.test(nx)) { location.replace(nx); } else { history.replaceState(null, '', location.pathname); }
    }
    token = localStorage.getItem(KEY);
  } catch (e) { token = qs.get('t'); }

  var gReady = false;
  function googleButton() {
    if (gReady) return; gReady = true;
    // Inside another app's browser (Instagram, Discord, Facebook...), Google blocks its sign-in and the screen goes
    // blank. Say so, and offer the way out (same check as jf.js).
    var ua = navigator.userAgent || '';
    if (/FBAN|FBAV|FB_IAB|Instagram|Line\/|Twitter|TikTok|musical_ly|Bytedance|Snapchat|Discord|LinkedInApp|Pinterest|GSA\/|; wv\)/i.test(ua) || (/(iPhone|iPad|iPod)/.test(ua) && /AppleWebKit/.test(ua) && !/Safari\//.test(ua))) {
      var gb = $('gbtn'); gb.textContent = '';
      var nb = document.createElement('div'); nb.className = 'small'; nb.style.cssText = 'border:1px solid #C9A45C;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;max-width:420px';
      var t1 = document.createElement('b'); t1.textContent = 'Google sign-in does not work inside this app'; nb.appendChild(t1);
      var t2 = document.createElement('span'); t2.textContent = 'You opened VeeFam inside another app (like Instagram, Discord or Facebook). Sign in with your email instead, or open this page in Safari or Chrome to use Google.'; nb.appendChild(t2);
      var cp = document.createElement('button'); cp.type = 'button'; cp.className = 'ghost'; cp.style.cssText = 'min-height:0;padding:8px 12px'; cp.textContent = 'Copy the link to open in Safari or Chrome';
      cp.addEventListener('click', function () { var u = location.href; try { navigator.clipboard.writeText(u).then(function () { cp.textContent = 'Copied! Paste it in Safari or Chrome.'; }, function () { prompt('Copy this link:', u); }); } catch (e) { prompt('Copy this link:', u); } });
      nb.appendChild(cp);
      if (/Android/i.test(ua)) { var oc = document.createElement('a'); oc.textContent = 'Open in Chrome'; oc.href = 'intent://' + location.host + location.pathname + location.search + '#Intent;scheme=https;package=com.android.chrome;end'; nb.appendChild(oc); }
      gb.appendChild(nb); return;
    }
    fetch('/api/google', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (c) {
      if (!c.clientId) return;
      var sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true;
      sc.onload = function () {
        window.google.accounts.id.initialize({ client_id: c.clientId, use_fedcm_for_button: true, callback: function (resp) {
          $('msg').textContent = 'Signing you in...';
          fetch('/api/google', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ credential: resp.credential }) })
            .then(function (r) { return r.json(); })
            .then(function (r) {
              if (r.error) { $('msg').textContent = r.error; return; }
              token = r.token; try { localStorage.setItem(KEY, token); } catch (e) {}
              $('msg').textContent = ''; load();
            }, function () { $('msg').textContent = 'Could not sign in. Try again.'; });
        } });
        window.google.accounts.id.renderButton($('gbtn'), { theme: 'filled_black', size: 'large', text: 'continue_with', shape: 'pill', logo_alignment: 'center', width: 320 });
      };
      document.head.appendChild(sc);
    }, function () {});
  }
  $('mailForm').addEventListener('submit', function (ev) {
    ev.preventDefault(); $('mailGo').disabled = true; $('msg').textContent = 'Sending...';
    var nx = new URLSearchParams(location.search).get('next') || '';
    fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ email: $('mailIn').value, next: nx }) })
      .then(function (r) { return r.json(); })
      .then(function (r) { $('mailGo').disabled = false; $('msg').textContent = r.error || 'Check your inbox for a sign-in link from us. It can take a minute (look in spam too).'; },
        function () { $('mailGo').disabled = false; $('msg').textContent = 'Could not send just now. Try again.'; });
  });
  function signedOut(note) {
    googleButton();
    $('signin').hidden = false; $('list').hidden = true; $('foot').hidden = true; $('foot').style.display = 'none';
    $('who').textContent = 'YOUR ACCOUNT';
    if (note) $('msg').textContent = note;
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function row(label, value) { var r = el('div', 'row'); r.appendChild(el('span', 'dim', label)); r.appendChild(el('span', null, value)); return r; }
  function money(v) { return v === '' ? '-' : '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2 }); }

  function show(data) {
    $('signin').hidden = true;
    $('who').textContent = data.email.toUpperCase();
    $('lead').textContent = data.orders.length ? 'Every order placed with this email, newest first. The status updates as your order moves.' : 'No orders have been placed with this email yet.';
    var list = $('list'); list.textContent = '';
    if (data.signed === true || data.signed === false) {
      var ag = el('section', 'card order'), ah = el('div', 'ohead'), al = el('div');
      al.appendChild(el('div', 'label', 'AGREEMENTS'));
      al.appendChild(el('h2', null, 'NDA and non-compete'));
      ah.appendChild(al); ah.appendChild(el('div', 'stat', data.signed ? 'SIGNED' : 'NOT SIGNED'));
      ag.appendChild(ah);
      if (!data.signed) { var sa = el('a', null, 'Read and sign now'); sa.href = '/sign.html?email=' + encodeURIComponent(data.email) + '&next=' + encodeURIComponent('/account.html'); ag.appendChild(sa); }
      list.appendChild(ag);
    }
    data.orders.forEach(function (o) {
      var card = el('section', 'card order');
      var head = el('div', 'ohead'), left = el('div');
      left.appendChild(el('div', 'label', 'INVOICE ' + o.invoice));
      left.appendChild(el('h2', null, o.product + ' x ' + o.units));
      head.appendChild(left); head.appendChild(el('div', 'stat', (o.status || 'Received').toUpperCase()));
      card.appendChild(head);
      var rows = el('div', 'rows');
      rows.appendChild(row('Placed', o.placed));
      rows.appendChild(row('Paid with', o.plan));
      rows.appendChild(row('Order total', money(o.total)));
      rows.appendChild(row('Paid so far', money(o.paid)));
      rows.appendChild(row('Balance due', money(o.balance)));
      if (o.ship) rows.appendChild(row('Ships to', o.ship));
      card.appendChild(rows);
      if (o.edit) card.appendChild(addrForm(o));
      // Ask the seller to return (or cancel) this order: placed by accident, changed your mind, or a problem.
      if (o.invoice && /^W/.test(String(o.invoice))) { var rb = document.createElement('button'); rb.type = 'button'; rb.className = 'ghost'; rb.textContent = '↩️ Request a return'; rb.style.alignSelf = 'flex-start';
        rb.addEventListener('click', function () { if (rb.dataset.open) return; rb.dataset.open = '1'; var w = el('div'); w.style.cssText = 'display:flex;flex-direction:column;gap:8px'; var ta = document.createElement('textarea'); ta.rows = 2; ta.maxLength = 500; ta.placeholder = 'Why? (ordered by accident, changed my mind, it arrived damaged…)'; var sb = document.createElement('button'); sb.type = 'button'; sb.className = 'solid'; sb.textContent = 'Send the request to the seller'; sb.style.alignSelf = 'flex-start'; var rm = el('div', 'small', '');
          sb.addEventListener('click', function () { sb.disabled = true; fetch('/api/market', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ do: 'return-request', t: token, n: o.invoice, reason: ta.value }) }).then(function (r) { return r.json(); }).then(function (x) { sb.disabled = false; rm.textContent = x.error || 'Sent. The seller answers by email; returns go by the seller\u2019s policy on the listing.'; if (!x.error) { ta.remove(); sb.remove(); } }).catch(function () { sb.disabled = false; rm.textContent = 'Could not send it. Try again.'; }); });
          w.appendChild(ta); w.appendChild(sb); w.appendChild(rm); card.appendChild(w); });
        card.appendChild(rb); }
      if (o.proof) { var a = el('a', null, 'View proof of payment'); a.href = o.proof; a.target = '_blank'; a.rel = 'noopener'; card.appendChild(a); }
      list.appendChild(card);
    });
    list.hidden = false; $('foot').hidden = false; $('foot').style.display = 'flex';
    jarsCard(); jfOrders();
  }

  // Change the shipping address of an order that has not shipped yet.
  function addrForm(o) {
    var w = document.createElement('div'); w.style.cssText = 'display:flex;flex-direction:column;gap:10px;margin-top:6px';
    var open = document.createElement('button'); open.type = 'button'; open.className = 'ghost'; open.textContent = 'Change shipping address'; open.style.alignSelf = 'flex-start';
    w.appendChild(open);
    open.addEventListener('click', function () {
      open.hidden = true;
      var f = document.createElement('div'); f.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px';
      var mk = function (label, val, basis) { var l = document.createElement('label'); l.style.cssText = 'display:flex;flex-direction:column;gap:4px;flex:1 1 ' + basis + ';min-width:0'; l.appendChild(document.createTextNode(label)); var i = document.createElement('input'); i.value = val || ''; l.appendChild(i); f.appendChild(l); return i; };
      var e = o.edit, nm = mk('Name', e.name, '100%'), st = mk('Street address', e.street, '100%'), l2 = mk('Apt, suite (optional)', e.line2, '100%'), ci = mk('City', e.city, '160px'), sa = mk(e.intl ? 'State / region (if any)' : 'State', e.state, '100px'), zp = mk(e.intl ? 'Postal code' : 'ZIP code', e.zip, '110px');
      w.appendChild(f);
      if (e.intl) { var cn = document.createElement('div'); cn.className = 'small dim'; cn.textContent = 'The country stays the same as on your order.'; w.appendChild(cn); }
      var bar = document.createElement('div'); bar.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap';
      var save = document.createElement('button'); save.type = 'button'; save.className = 'solid'; save.textContent = 'Save new address';
      var cancel = document.createElement('button'); cancel.type = 'button'; cancel.className = 'ghost'; cancel.textContent = 'Cancel';
      bar.appendChild(save); bar.appendChild(cancel); w.appendChild(bar);
      var say = document.createElement('div'); say.className = 'small'; say.setAttribute('role', 'status'); w.appendChild(say);
      cancel.addEventListener('click', function () { load(); });
      save.addEventListener('click', function () {
        save.disabled = true; say.textContent = 'Saving...';
        fetch('/api/orders', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ t: token, n: o.invoice, addr: { name: nm.value, street: st.value, line2: l2.value, city: ci.value, state: sa.value, zip: zp.value } }) }).then(function (r) { return r.json(); }).then(function (r) {
          save.disabled = false;
          if (r.error) { say.textContent = r.error; return; }
          say.textContent = 'Saved. Your order will ship to: ' + r.ship; setTimeout(load, 1500);
        }, function () { save.disabled = false; say.textContent = 'Could not reach the site. Try again.'; });
      });
    });
    return w;
  }
  // Orders this email placed on jarfriends.com before the move to VeeFam, with their tracking.
  function jfOrders() {
    if ($('jfOld')) return;
    var box = document.createElement('div'); box.id = 'jfOld'; box.style.cssText = 'display:flex;flex-direction:column;gap:14px'; $('list').appendChild(box);
    fetch('/api/market?do=jf-orders&t=' + encodeURIComponent(token), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (r) {
      var os = r.orders || [];
      // Only people who ordered on jarfriends.com see this section; nobody else sees anything (not even an error).
      if (!os.length) { box.remove(); return; }
      box.appendChild(el('div', 'mono gold', 'YOUR ORDERS FROM JARFRIENDS.COM'));
      os.forEach(function (o) {
        var card = el('section', 'card order'), head = el('div', 'ohead'), left = el('div');
        left.appendChild(el('div', 'label', 'JARFRIENDS ORDER ' + o.n));
        left.appendChild(el('h2', null, o.product + (o.q > 1 ? ' x ' + o.q : '')));
        head.appendChild(left); head.appendChild(el('div', 'stat', o.shipped ? 'SHIPPED' : o.paid ? 'PAID · PACKING' : 'PAYMENT DUE'));
        card.appendChild(head);
        var rows = el('div', 'rows');
        rows.appendChild(row('Placed', new Date(o.at).toLocaleDateString('en-US', { dateStyle: 'medium' })));
        if (o.pay) rows.appendChild(row('Paid with', o.pay));
        if (o.total) rows.appendChild(row('Order total', money(o.total)));
        if (o.ship) rows.appendChild(row('Ships to', o.ship));
        if (o.shippedAt) rows.appendChild(row('Shipped', new Date(o.shippedAt).toLocaleDateString('en-US', { dateStyle: 'medium' })));
        if (o.tracking) rows.appendChild(row('Tracking', o.tracking));
        card.appendChild(rows);
        if (o.track) { var a = el('a', null, 'Track this package'); a.href = o.track; a.target = '_blank'; a.rel = 'noopener'; card.appendChild(a); }
        box.appendChild(card);
      });
    }).catch(function () {});
  }
  // How many jars this customer has, at the top of their orders.
  function jarsCard() {
    if ($('jarsTop')) return;
    fetch('/api/jars?t=' + encodeURIComponent(token), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (r) {
      if (r.error || r.jars == null || $('jarsTop')) return;
      var c = document.createElement('a'); c.id = 'jarsTop'; c.href = '/jars.html'; c.className = 'card'; c.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none;color:inherit;border-color:#C9A45C';
      var l = document.createElement('div'); var b = document.createElement('b'); b.textContent = 'You have ' + r.jars + (r.jars === 1 ? ' jar' : ' jars'); l.appendChild(b);
      var sm = document.createElement('div'); sm.className = 'small'; sm.textContent = 'One jar for every paid order.' + (r.burn && r.burn.open ? ' A burn is open now: tap to see it.' : ' Tap to see your jars.'); l.appendChild(sm);
      c.appendChild(l); var g = document.createElement('span'); g.className = 'gold'; g.textContent = 'My jars'; c.appendChild(g);
      var list = $('list'); list.parentNode.insertBefore(c, list);
    }).catch(function () {});
  }
  $('out').addEventListener('click', function () {
    try { localStorage.removeItem(KEY); } catch (e) {}
    token = null; $('lead').textContent = 'You are signed out.'; signedOut('');
  });

  function load() {
    fetch('/api/orders?t=' + encodeURIComponent(token), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (r) {
      if (r.error) { if (/expired/.test(r.error)) { try { localStorage.removeItem(KEY); } catch (e) {} } signedOut(r.error); return; }
      show(r);
    }, function () { signedOut('Could not load your orders. Check your connection and reload.'); });
  }
  if (!token) { signedOut(''); return; }
  load();
})();
</script>
</body>
</html>
