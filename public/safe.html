<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buyers-only safe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:wght@600;700;800&display=swap">
<link rel="stylesheet" href="/site.css">
<style>
[hidden]{display:none!important}
.stage{position:relative;width:min(100%,440px);aspect-ratio:1/1;margin:0 auto;perspective:1400px}
.inside{position:absolute;inset:5% 6% 6% 6%;border-radius:10px;background:radial-gradient(circle at 50% 40%,#FFF3C4 0%,#E9C46A 22%,#7A5A1E 60%,#1A1408 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;box-sizing:border-box;text-align:center;opacity:0;transition:opacity .9s ease .35s;overflow:hidden}
.inside img{max-width:84%;max-height:64%;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.55);background:#0B1A13;position:relative;z-index:1}
.inside .tag{position:relative;z-index:1;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:#1A1408;background:rgba(255,255,255,.55);border-radius:999px;padding:3px 10px}
.inside .pr{position:relative;z-index:1;font-weight:900;color:#0B1A13;font-size:26px;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.rays{position:absolute;inset:-60%;background:conic-gradient(from 0deg,rgba(255,255,255,0) 0deg,rgba(255,250,220,.75) 8deg,rgba(255,255,255,0) 18deg,rgba(255,255,255,0) 40deg,rgba(255,250,220,.6) 50deg,rgba(255,255,255,0) 62deg,rgba(255,255,255,0) 88deg,rgba(255,250,220,.75) 98deg,rgba(255,255,255,0) 110deg,rgba(255,255,255,0) 136deg,rgba(255,250,220,.6) 146deg,rgba(255,255,255,0) 160deg,rgba(255,255,255,0) 182deg,rgba(255,250,220,.75) 192deg,rgba(255,255,255,0) 204deg,rgba(255,255,255,0) 228deg,rgba(255,250,220,.6) 238deg,rgba(255,255,255,0) 250deg,rgba(255,255,255,0) 274deg,rgba(255,250,220,.75) 284deg,rgba(255,255,255,0) 296deg,rgba(255,255,255,0) 320deg,rgba(255,250,220,.6) 330deg,rgba(255,255,255,0) 344deg);opacity:0;pointer-events:none}
.stage.open .rays{animation:raysIn 1.4s ease 1.6s both,spin 24s linear 1.6s infinite}
@keyframes raysIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.door{position:absolute;inset:0;transform-origin:2% 50%;transition:transform 2.4s cubic-bezier(.45,.05,.2,1);transform-style:preserve-3d;z-index:2}
.door img{width:100%;height:100%;display:block;border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.6);backface-visibility:hidden}
.stage.shake .door{animation:shake .5s ease 2}
.stage.open .door{transform:rotateY(-112deg)}
.stage.open .inside{opacity:1}
.stage.instant .door,.stage.instant .inside{transition:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px) rotate(-.4deg)}75%{transform:translateX(3px) rotate(.4deg)}}
/* The key: slides into the lock, turns, and the safe opens. */
.key{position:absolute;left:50%;top:50%;z-index:4;width:120px;margin:-22px 0 0 -170px;opacity:0;pointer-events:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
.stage.keying .key{animation:keyIn 1.1s cubic-bezier(.3,.7,.3,1) both}
.stage.turning .key{opacity:1;transform:translateX(110px) rotate(90deg);transition:transform .45s ease}
.stage.shake .key,.stage.open .key{opacity:0;transition:opacity .3s}
@keyframes keyIn{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:translateX(110px)}}
.flash{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,244,200,.85),rgba(255,214,110,.25) 45%,rgba(255,200,80,0) 70%);opacity:0;pointer-events:none;z-index:20}
.flash.go{animation:flash 1.6s ease-out both}
@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:21}
.badge{display:inline-flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;color:#0B1A13;background:linear-gradient(90deg,#E9C46A,#FFF1B8,#E9C46A);border-radius:999px;padding:6px 14px;box-shadow:0 0 24px rgba(233,196,106,.55)}
.reveal{animation:rise .8s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.keybtn{display:inline-flex;align-items:center;gap:10px;align-self:center}
#buy{align-self:center}
.nm{font-weight:800;font-size:19px;line-height:1.35;max-width:620px;margin:0 auto}
.center{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.thanks{max-width:520px;font-size:15px;line-height:1.55}
@media (prefers-reduced-motion: reduce){.stage .door,.stage .inside{transition:none!important}.rays,.key,.flash,.reveal,.stage.shake .door{animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap bar"><a class="brand" href="/" style="text-decoration:none">JarFriends</a><span style="display:flex;align-items:center;gap:20px"><span class="mono dim">BUYERS ONLY</span><a class="home" href="/">Home</a></span></div></header>
<main class="wrap page">
  <div class="stack-s center">
    <div class="mono gold" id="eyebrow">FOR PAST BUYERS</div>
    <h1 id="head">The buyers-only safe</h1>
    <div class="small" id="lead">Checking the lock...</div>
    <div class="nm reveal" id="nm" hidden></div>
  </div>
  <div class="stage" id="stage">
    <div class="inside" id="inside">
      <div class="rays" aria-hidden="true"></div>
      <span class="tag">REWARD UNLOCKED</span>
      <img id="pic" alt="" hidden>
      <div class="pr" id="pr"></div>
    </div>
    <div class="door"><img src="/photos/vault.jpg" alt="A steel safe, locked"></div>
    <svg class="key" viewBox="0 0 120 44" aria-hidden="true"><defs><linearGradient id="kg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF1B8"/><stop offset=".5" stop-color="#E0B44E"/><stop offset="1" stop-color="#8A6420"/></linearGradient></defs><circle cx="22" cy="22" r="18" fill="url(#kg)"/><circle cx="22" cy="22" r="7" fill="#0B1A13"/><rect x="38" y="17" width="78" height="10" rx="3" fill="url(#kg)"/><rect x="92" y="27" width="7" height="11" fill="url(#kg)"/><rect x="104" y="27" width="7" height="8" fill="url(#kg)"/></svg>
  </div>
  <div class="center">
    <button class="solid keybtn" type="button" id="open" hidden><span aria-hidden="true">🔑</span> Use your buyer's key</button>
    <span class="badge reveal" id="badge" hidden>★ PAST BUYER REWARD ★</span>
    <div class="thanks reveal" id="thanks" hidden>Thank you for buying from JarFriends. This safe only opens for people who already have, so this one is just for you.</div>
    <a class="solid reveal" id="buy" hidden style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center">Claim my reward</a>
    <a class="solid" id="signin" href="/account.html" hidden style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center">Sign in to open</a>
    <div class="small reveal" id="desc" style="max-width:560px"></div>
    <a class="home" href="/">Back to the shop</a>
  </div>
</main>
<div class="flash" id="flash" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var id = new URLSearchParams(location.search).get('product') || '', tok = '';
  try { tok = localStorage.getItem('acct_token') || ''; } catch (e) { tok = ''; }
  var seenKey = 'jf-safe-open-' + id, seen = false;
  try { seen = localStorage.getItem(seenKey) === '1'; } catch (e) { seen = false; }
  var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Sounds, made in the browser: the key, the bolts, then a bright chime.
  var actx = null;
  function sound(step) {
    try {
      var C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      actx = actx || new C(); if (actx.state === 'suspended') actx.resume();
      var t = actx.currentTime;
      var tick = function (when, f, g) { var n = Math.floor(actx.sampleRate * 0.06), b = actx.createBuffer(1, n, actx.sampleRate), d = b.getChannelData(0); for (var k = 0; k < n; k++) d[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / n, 5); var s = actx.createBufferSource(), fl = actx.createBiquadFilter(), a = actx.createGain(); s.buffer = b; fl.type = 'bandpass'; fl.frequency.value = f; fl.Q.value = 3; a.gain.value = g; s.connect(fl); fl.connect(a); a.connect(actx.destination); s.start(t + when); };
      var tone = function (f, when, dur, g) { var o = actx.createOscillator(), a = actx.createGain(); o.type = 'triangle'; o.frequency.value = f; a.gain.setValueAtTime(0.0001, t + when); a.gain.exponentialRampToValueAtTime(g, t + when + 0.02); a.gain.exponentialRampToValueAtTime(0.0001, t + when + dur); o.connect(a); a.connect(actx.destination); o.start(t + when); o.stop(t + when + dur + 0.05); };
      if (step === 'key') { tick(0, 2600, 0.5); tick(0.5, 1800, 0.7); tick(0.62, 900, 0.9); }
      if (step === 'bolts') { tick(0, 500, 1.2); tick(0.18, 450, 1.2); tick(0.36, 400, 1.3); }
      if (step === 'win') { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function (f, k) { tone(f, k * 0.1, 1.6, 0.08); }); tone(1567.98, 0.55, 2.2, 0.05); }
    } catch (e) { /* sound is an extra */ }
  }
  // Gold confetti across the whole page.
  function confetti() {
    if (calm) return;
    var c = $('confetti'), x = c.getContext('2d'), W = c.width = innerWidth, H = c.height = innerHeight, cols = ['#E9C46A', '#FFF1B8', '#C9A45C', '#8FD3AE', '#F7F2E6', '#E86A5C'], bits = [];
    for (var i = 0; i < 160; i++) bits.push({ x: W / 2 + (Math.random() - 0.5) * 80, y: H * 0.45, vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 15 - 4, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3, w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, c: cols[i % cols.length] });
    var start = performance.now();
    (function frame(now) {
      x.clearRect(0, 0, W, H);
      bits.forEach(function (b) { b.vy += 0.35; b.vx *= 0.99; b.x += b.vx; b.y += b.vy; b.r += b.vr; x.save(); x.translate(b.x, b.y); x.rotate(b.r); x.fillStyle = b.c; x.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.r * 2))); x.restore(); });
      if (now - start < 4200) requestAnimationFrame(frame); else x.clearRect(0, 0, W, H);
    })(start);
  }
  function showAfter(p) {
    $('eyebrow').textContent = 'PAST BUYERS ONLY';
    $('head').textContent = 'Your reward is unlocked';
    $('nm').textContent = p.name; $('nm').hidden = false;
    $('lead').textContent = '';
    $('badge').hidden = false; $('thanks').hidden = false;
    $('desc').textContent = (p.desc ? p.desc + ' ' : '') + (p.nft ? '' : Number(p.ship) > 0 ? 'Shipping $' + p.ship + '.' : 'Free shipping.');
    $('buy').href = '/order.html?product=' + encodeURIComponent(id) + '&qty=' + (p.min || 1); $('buy').hidden = false;
  }

  fetch('/api/order' + (tok ? '?t=' + encodeURIComponent(tok) : ''), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
    var p = (j.products || []).filter(function (x) { return x.id === id; })[0];
    if (!p) { $('head').textContent = 'This safe is not here'; $('lead').textContent = 'It may have been claimed already. Have a look at the shop.'; return; }
    if (p.locked) {
      if (p.gate === 'buyer') {
        $('lead').textContent = 'You are signed in, but there is no paid order under this email yet. Buy any piece in the shop and this safe opens for you.';
      } else {
        $('lead').textContent = 'This safe opens only for past buyers. Sign in with the email you ordered with, then come back here.';
        $('signin').hidden = false;
      }
      return;
    }
    if (!p.buyersOnly) { location.replace('/order.html?product=' + encodeURIComponent(id) + '&qty=1'); return; }
    if (!(Number(p.stock) > 0)) { $('head').textContent = 'Already claimed'; $('lead').textContent = 'Another buyer got to this safe first.'; return; }
    $('pr').textContent = '$' + p.price + (p.eth ? ' (about ' + p.eth + ' ETH)' : '');
    if (p.photo) { $('pic').src = p.photo; $('pic').hidden = false; }
    // Opened before on this device: the safe stands open.
    if (seen) { $('stage').className = 'stage open instant'; showAfter(p); return; }
    $('head').textContent = 'You earned a key';
    $('lead').textContent = 'Welcome back. Because you have bought from JarFriends before, this safe opens for you.';
    $('open').hidden = false;
    $('open').addEventListener('click', function () {
      $('open').hidden = true; $('lead').textContent = 'Turning the key...';
      var st = $('stage');
      st.className = 'stage keying'; sound('key');
      setTimeout(function () { st.className = 'stage turning'; }, 1100);
      setTimeout(function () { st.className = 'stage shake'; sound('bolts'); $('lead').textContent = 'Unlocking...'; }, 1700);
      setTimeout(function () { st.className = 'stage open'; }, 2700);
      setTimeout(function () { sound('win'); $('flash').className = 'flash go'; confetti(); }, 3500);
      setTimeout(function () { showAfter(p); try { localStorage.setItem(seenKey, '1'); } catch (e) { /* fine */ } }, 4300);
    });
  }, function () { $('lead').textContent = 'Could not reach the shop. Reload the page.'; });
})();
</script>
</body>
</html>
