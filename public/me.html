<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>My account · V2V</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:wght@600;700;800&display=swap">
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/market.css">
</head>
<body>
<header class="top"><div class="wrap bar"><a class="brand" href="/" style="text-decoration:none">V2V</a><span style="display:flex;align-items:center;gap:20px"><span class="mono dim">MY ACCOUNT</span><a class="home" href="/market.html">Market</a></span></div></header>
<main class="wrap page" style="gap:28px" id="page">
  <div class="stack-s">
    <div class="mono gold" id="who">YOUR ACCOUNT</div>
    <h1 id="head">My account</h1>
    <div class="small" id="lead">One account for buying and selling on V2V.</div>
  </div>
  <div id="box"></div>
</main>
<script src="/jf.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); }, el = JF.el;
  var qs = new URLSearchParams(location.search), tok = JF.token(), D = null, box = $('box');
  var WAYS = [['card', 'Saved card'], ['crypto', 'Crypto'], ['zelle', 'Zelle'], ['venmo', 'Venmo'], ['cashapp', 'Cash App'], ['cash', 'Cash']];
  function field(label, input, hint) { var l = el('label', label); l.appendChild(input); if (hint) l.appendChild(el('span', hint, 'hint')); return l; }
  function input(v, attrs) { var i = el('input'); if (v != null) i.value = v; Object.keys(attrs || {}).forEach(function (k) { i.setAttribute(k, attrs[k]); }); return i; }
  function status() { var m = el('div', '', 'small'); m.setAttribute('role', 'status'); return m; }
  function post(body) { body.t = tok; return JF.api(body.do === 'review' ? '/api/market' : '/api/me', body); }

  function load() {
    var added = qs.get('added');
    var go = added ? JF.api('/api/me?do=card-done&session=' + encodeURIComponent(added) + '&t=' + encodeURIComponent(tok)) : Promise.resolve(null);
    return go.then(function (r) {
      if (added) history.replaceState(null, '', location.pathname);
      var note = r ? (r.ok ? 'Your card is saved and set as your default.' : r.error) : '';
      return JF.api('/api/me?t=' + encodeURIComponent(tok)).then(function (m) {
        if (m._status === 401) { JF.signOut(); tok = ''; return ask(); }
        if (m.error) { box.textContent = m.error; return; }
        D = m; draw(note);
      });
    });
  }
  function ask() {
    $('head').textContent = 'Sign in';
    $('lead').textContent = 'Sign in or create your V2V account. One account lets you buy, and open a shop whenever you want.';
    JF.signInBox(box, '', function (t) { tok = t; $('lead').textContent = 'One account for buying and selling on V2V.'; $('head').textContent = 'My account'; load(); }, qs.get('new') ? 'signup' : 'login');
  }

  function draw(note) {
    $('who').textContent = D.email.toUpperCase();
    $('head').textContent = D.name ? 'Hi, ' + D.name.split(' ')[0] : 'My account';
    box.textContent = '';
    var wrap = el('div'); wrap.style.cssText = 'display:flex;flex-direction:column;gap:22px';
    JF.modeBar(wrap, 'buyer');
    if (note) wrap.appendChild(el('div', note, 'alert small'));
    var links = el('div'); links.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px';
    [['My orders', '/account.html'], ['My wishlist', '/wishlist.html'], ['Browse the market', '/market.html']].forEach(function (x) { var a = el('a', x[0], 'ghost'); a.href = x[1]; a.style.textDecoration = 'none'; links.appendChild(a); });
    wrap.appendChild(links);
    wrap.appendChild(offerCard());
    wrap.appendChild(tradeCard());
    wrap.appendChild(reviewCard());
    wrap.appendChild(payCard());
    wrap.appendChild(addrCard());
    wrap.appendChild(profileCard());
    var out = el('button', 'Sign out', 'ghost'); out.type = 'button'; out.style.alignSelf = 'flex-start';
    out.addEventListener('click', function () { JF.signOut(); location.href = '/'; });
    wrap.appendChild(out);
    box.appendChild(wrap);
  }

  // Review your purchases: every shipped order from a seller, with a 1-5 star pick and a few words.
  // Offers the buyer has made, one row per piece, with the full back-and-forth under View history.
  function offerCard() {
    var c = el('section', null, 'card'); c.style.gap = '6px'; c.hidden = true; c.id = 'offers';
    c.appendChild(el('h2', 'My offers'));
    JF.api('/api/market?do=myoffers&t=' + encodeURIComponent(tok)).then(function (r) {
      if (!r.offers || !r.offers.length) return;
      c.hidden = false;
      var words = { pending: 'WAITING FOR THE SELLER', accepted: 'ACCEPTED', countered: 'COUNTER OFFER', declined: 'DECLINED', auto: 'DECLINED', expired: 'RAN OUT' };
      var by = {}, order = [];
      r.offers.forEach(function (o) { if (!by[o.pid]) { by[o.pid] = []; order.push(o.pid); } by[o.pid].push(o); });
      order.forEach(function (pid) {
        var list = by[pid], last = list[0];
        var row = el('div', null, 'jf-row'); row.style.flexDirection = 'column'; row.style.alignItems = 'stretch';
        var top = el('div'); top.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between';
        var a = el('a', last.item); a.href = '/order.html?product=' + encodeURIComponent(pid); a.style.fontWeight = '700'; top.appendChild(a);
        top.appendChild(el('span', words[last.status] || String(last.status).toUpperCase(), 'jf-badge ' + (last.status === 'accepted' || last.status === 'countered' ? 'ok' : last.status === 'pending' ? 'wait' : 'off')));
        row.appendChild(top);
        row.appendChild(el('div', 'Your latest offer: ' + JF.cents(last.offer) + (last.q > 1 ? ' each' : '') + ' · listed at ' + JF.cents(last.list) + (last.status === 'countered' ? ' · seller countered at ' + JF.cents(last.counter) : '') + ((last.status === 'accepted' || last.status === 'countered') && last.until ? ' · check out by ' + new Date(last.until).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' }) + ' (the link is in your email)' : ''), 'small'));
        var hb = el('button', 'View history of offers' + (list.length > 1 ? ' (' + list.length + ')' : ''), 'ghost'); hb.type = 'button'; hb.style.alignSelf = 'flex-start';
        var hist = el('div'); hist.hidden = true;
        hb.addEventListener('click', function () { if (!hist.firstChild) hist.appendChild(JF.offerHistory(list, 'buyer')); hist.hidden = !hist.hidden; hb.textContent = hist.hidden ? 'View history of offers' + (list.length > 1 ? ' (' + list.length + ')' : '') : 'Hide history'; });
        row.appendChild(hb); row.appendChild(hist);
        c.appendChild(row);
      });
      if (location.hash === '#offers') setTimeout(function () { c.scrollIntoView({ behavior: 'smooth' }); }, 300);
    }).catch(function () {});
    return c;
  }
  // Trades the buyer has sent, with the seller's answer.
  function tradeCard() {
    var c = el('section', null, 'card'); c.style.gap = '6px'; c.hidden = true;
    c.appendChild(el('h2', 'My trade requests'));
    JF.api('/api/market?do=mytrades&t=' + encodeURIComponent(tok)).then(function (r) {
      if (!r.trades || !r.trades.length) return;
      c.hidden = false;
      var money = function (t) { return t.dir === 'add' ? 'you add ' + JF.cents(t.diff) : t.dir === 'ask' ? 'you get ' + JF.cents(t.diff) + ' back' : 'even swap'; };
      r.trades.forEach(function (t) {
        var row = el('div', null, 'jf-row');
        if (t.photoUrl) { var im = el('img'); im.src = t.photoUrl; im.alt = ''; im.style.cssText = 'width:64px;height:64px;object-fit:cover;border-radius:4px'; row.appendChild(im); }
        var mid = el('div'); mid.style.cssText = 'flex:1;min-width:0;display:flex;flex-direction:column;gap:4px';
        mid.appendChild(el('b', 'For: ' + t.product));
        mid.appendChild(el('span', t.status === 'pending' ? 'WAITING FOR THE SELLER' : t.status === 'accepted' ? 'ACCEPTED' : t.status === 'declined' ? 'PASSED' : 'WITHDRAWN', 'jf-badge ' + (t.status === 'accepted' ? 'ok' : t.status === 'pending' ? 'wait' : 'off')));
        mid.appendChild(el('div', t.text + ' · ' + money(t), 'small'));
        if (t.reply) mid.appendChild(el('div', 'Seller: ' + t.reply, 'small'));
        if (t.status === 'accepted') mid.appendChild(el('div', 'Check your email for the seller\'s address to arrange the swap.', 'small dim'));
        if (t.status === 'pending') {
          var w = el('button', 'Withdraw', 'ghost'); w.type = 'button'; w.style.alignSelf = 'flex-start';
          w.addEventListener('click', function () { if (!confirm('Withdraw this trade request?')) return; w.disabled = true; JF.api('/api/market', { do: 'trade-withdraw', t: tok, slug: t.slug, id: t.id }).then(function (x) { if (x.error) { alert(x.error); w.disabled = false; return; } location.reload(); }); });
          mid.appendChild(w);
        }
        row.appendChild(mid); c.appendChild(row);
      });
    }).catch(function () {});
    return c;
  }
  function reviewCard() {
    var c = el('section', null, 'card'); c.style.gap = '6px'; c.hidden = true;
    c.appendChild(el('h2', 'Review your purchases'));
    c.appendChild(el('div', 'Your stars show on the seller’s page with your first name and last initial. Low ratings count against a seller’s verified checkmark, so be fair and specific.', 'small dim'));
    JF.api('/api/market?do=reviewable&t=' + encodeURIComponent(tok)).then(function (r) {
      if (!r.orders || !r.orders.length) return;
      c.hidden = false;
      r.orders.forEach(function (o) {
        var row = el('div', null, 'jf-review');
        var t = el('div'); t.appendChild(el('b', o.product)); t.appendChild(el('span', ' from ' + o.sellerName + ' · order ' + o.n, 'small dim')); row.appendChild(t);
        var pick = 0, pk = el('div', null, 'jf-starpick'); pk.setAttribute('role', 'group'); pk.setAttribute('aria-label', 'Stars for ' + o.product);
        var btns = [1, 2, 3, 4, 5].map(function (n) {
          var b = el('button', '★'); b.type = 'button'; b.setAttribute('aria-label', n + (n === 1 ? ' star' : ' stars'));
          b.addEventListener('click', function () { pick = n; btns.forEach(function (x, i) { x.setAttribute('aria-pressed', i < n ? 'true' : 'false'); }); });
          pk.appendChild(b); return b;
        });
        var txt = el('textarea', null, 'jf-ta'); txt.maxLength = 1000; txt.placeholder = 'How was the piece, the packing and the shipping?'; txt.setAttribute('aria-label', 'Your review of ' + o.product); txt.style.minHeight = '70px';
        var go = el('button', o.review ? 'Update review' : 'Post review', 'ghost'); go.type = 'button'; go.style.alignSelf = 'flex-start';
        var m = status();
        if (o.review) { pick = o.review.stars; btns.forEach(function (x, i) { x.setAttribute('aria-pressed', i < pick ? 'true' : 'false'); }); txt.value = o.review.text; }
        go.addEventListener('click', function () {
          if (!pick) { m.textContent = 'Pick 1 to 5 stars first.'; return; }
          go.disabled = true; m.textContent = 'Saving…';
          post({ do: 'review', n: o.n, stars: pick, text: txt.value }).then(function (x) { go.disabled = false; m.textContent = x.error || 'Thanks, your review is posted.'; if (!x.error) go.textContent = 'Update review'; });
        });
        row.appendChild(pk); row.appendChild(txt); row.appendChild(go); row.appendChild(m);
        if (o.review && o.review.reply) { var rp = el('div', null, 'jf-reply'); rp.appendChild(el('b', 'Seller replied: ')); rp.appendChild(document.createTextNode(o.review.reply)); row.appendChild(rp); }
        c.appendChild(row);
      });
    });
    return c;
  }
  function payCard() {
    var c = el('section', null, 'card'); c.style.gap = '12px';
    c.appendChild(el('h2', 'How I pay'));
    c.appendChild(el('div', 'Save a card and checkout asks one question: "Use this card?" Cards are kept by Stripe, our payment processor. V2V never sees or stores your card number.', 'small dim'));
    var m = status();
    if (!D.cardsOn) c.appendChild(el('div', 'Saving cards is not switched on for this site yet. You can still pick your favorite way to pay below.', 'small'));
    else {
      if (D.cardTest) c.appendChild(el('div', 'TEST MODE: use Stripe test card 4242 4242 4242 4242, any future date, any CVC. No real money moves.', 'jf-badge wait'));
      if (!D.cards.length) c.appendChild(el('div', 'No saved cards yet.', 'small dim'));
      D.cards.forEach(function (k) {
        var r = el('div', null, 'jf-cardrow');
        r.appendChild(el('span', k.brand.slice(0, 4), 'jf-cc'));
        var t = el('div'); t.style.flex = '1'; t.appendChild(el('b', k.brand + ' ending ' + k.last4)); t.appendChild(el('div', 'Expires ' + k.exp + (k.funding ? ' · ' + k.funding : ''), 'small dim')); r.appendChild(t);
        if (k.id === D.defaultCard) r.appendChild(el('span', 'DEFAULT', 'jf-badge ok'));
        else { var d = el('button', 'Make default', 'ghost'); d.type = 'button'; d.addEventListener('click', function () { d.disabled = true; post({ do: 'card-default', pm: k.id }).then(function (x) { if (x.error) m.textContent = x.error; else load(); }); }); r.appendChild(d); }
        var rm = el('button', 'Remove', 'ghost'); rm.type = 'button';
        rm.addEventListener('click', function () { if (!confirm('Remove ' + k.brand + ' ending ' + k.last4 + '?')) return; rm.disabled = true; post({ do: 'card-remove', pm: k.id }).then(function (x) { if (x.error) m.textContent = x.error; else load(); }); });
        r.appendChild(rm);
        c.appendChild(r);
      });
      var add = el('button', D.cards.length ? 'Add another card' : 'Add a card', 'solid'); add.type = 'button';
      add.addEventListener('click', function () { add.disabled = true; m.textContent = 'Opening Stripe’s secure card page…'; post({ do: 'card-add' }).then(function (x) { if (x.url) location.href = x.url; else { add.disabled = false; m.textContent = x.error || 'Could not open the card page.'; } }); });
      c.appendChild(add);
    }
    c.appendChild(el('div', 'Pick first at checkout', 'label'));
    var pills = el('div', null, 'pills');
    WAYS.forEach(function (w) {
      if (w[0] === 'card' && !D.cardsOn) return;
      var b = el('button', w[1], 'pill'); b.type = 'button'; b.setAttribute('aria-pressed', D.prefer === w[0] ? 'true' : 'false');
      b.addEventListener('click', function () { var v = D.prefer === w[0] ? '' : w[0]; post({ do: 'prefer', method: v }).then(function (x) { if (x.error) { m.textContent = x.error; return; } D.prefer = x.prefer; Array.prototype.forEach.call(pills.children, function (p, i) { p.setAttribute('aria-pressed', 'false'); }); if (v) b.setAttribute('aria-pressed', 'true'); m.textContent = v ? w[1] + ' is picked first at checkout.' : 'No favorite set.'; }); });
      pills.appendChild(b);
    });
    c.appendChild(pills);
    c.appendChild(m);
    return c;
  }
  function addrCard() {
    var a = D.address || {};
    var c = el('section', null, 'card'); c.style.gap = '12px';
    c.appendChild(el('h2', 'Ship to'));
    c.appendChild(el('div', 'Checkout fills this in for you. US addresses only.', 'small dim'));
    var f = el('form');
    var n = input(a.name || D.name, { maxlength: '80', autocomplete: 'name' }), st = input(a.street, { maxlength: '120', autocomplete: 'address-line1' }), l2 = input(a.line2, { maxlength: '60', autocomplete: 'address-line2' });
    var ci = input(a.city, { maxlength: '60', autocomplete: 'address-level2' }), sa = input(a.state, { maxlength: '30', autocomplete: 'address-level1' }), z = input(a.zip, { maxlength: '10', autocomplete: 'postal-code', inputmode: 'numeric' });
    f.appendChild(field('Name', n));
    var two = el('div', null, 'two'); two.appendChild(field('Street address', st)); two.appendChild(field('Apt or unit', l2, 'Optional.')); f.appendChild(two);
    var three = el('div', null, 'two'); three.appendChild(field('City', ci)); three.appendChild(field('State', sa)); three.appendChild(field('ZIP code', z)); f.appendChild(three);
    var go = el('button', 'Save address', 'solid'); go.type = 'submit'; var m = status(); f.appendChild(go); f.appendChild(m);
    f.addEventListener('submit', function (ev) { ev.preventDefault(); go.disabled = true; post({ do: 'address', name: n.value, street: st.value, line2: l2.value, city: ci.value, state: sa.value, zip: z.value }).then(function (x) { go.disabled = false; m.textContent = x.error || 'Saved.'; }); });
    c.appendChild(f);
    return c;
  }
  function profileCard() {
    var c = el('section', null, 'card'); c.style.gap = '12px';
    c.appendChild(el('h2', 'Selling'));
    if (D.seller) {
      c.appendChild(el('div', 'Your shop: ' + D.seller.name + (D.seller.status === 'pending' ? ' (waiting for approval)' : D.seller.status === 'paused' ? ' (paused)' : ''), 'small'));
      var a = el('a', 'Switch to seller', 'solid'); a.href = '/seller.html'; a.style.textDecoration = 'none'; c.appendChild(a);
    } else {
      c.appendChild(el('div', 'Got pieces to sell? Open your own shop on this same account. It takes a minute.', 'small'));
      var b = el('a', 'Become a seller', 'solid'); b.href = '/seller.html'; b.style.textDecoration = 'none'; c.appendChild(b);
    }
    return c;
  }
  if (tok) load(); else ask();
})();
</script>
</body>
</html>
