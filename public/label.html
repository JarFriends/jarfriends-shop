<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Shipping label</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#E9E6DD;color:#000;font-family:Arial,Helvetica,sans-serif}
.tools{max-width:4in;margin:20px auto 12px;padding:0 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools button{font:inherit;font-weight:700;font-size:16px;min-height:44px;padding:0 22px;border:0;border-radius:999px;background:#101726;color:#fff;cursor:pointer}
.tools span{font-size:14px;color:#444}
.label{width:4in;height:6in;margin:0 auto 24px;background:#fff;border:1px solid #999;padding:.25in;display:flex;flex-direction:column}
.from{font-size:11pt;line-height:1.3;white-space:pre-line}
.from b{font-size:12pt}
.rule{border-top:2px solid #000;margin:.2in 0}
.cap{font-size:9pt;letter-spacing:.12em;margin-bottom:.08in}
.to{flex:1;display:flex;flex-direction:column;justify-content:center;padding-left:.35in;font-size:17pt;line-height:1.3;font-weight:700;overflow-wrap:anywhere}
.foot{border-top:2px solid #000;padding-top:.12in;font-size:10pt;line-height:1.35;display:flex;justify-content:space-between;gap:.2in}
.foot div:last-child{text-align:right;font-family:'Courier New',Courier,monospace;white-space:nowrap}
.msg{max-width:4in;margin:40px auto;padding:0 12px;font-size:16px}
@page{size:4in 6in;margin:0}
@media print{body{background:#fff}.tools{display:none}.label{margin:0;border:0}}
</style>
</head>
<body>
<div class="msg" id="msg" role="status">Loading the label...</div>
<div class="tools" id="tools" hidden>
  <button type="button" id="print">Print label</button>
  <span>Sized for a 4 x 6 inch label. On plain paper, cut it out and tape it on.</span>
</div>
<div class="label" id="label" hidden>
  <div class="from" id="from"></div>
  <div class="rule"></div>
  <div class="cap">SHIP TO</div>
  <div class="to" id="to"></div>
  <div class="foot"><div id="item"></div><div id="no"></div></div>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var token = new URLSearchParams(location.search).get('inv');
  function fail(t) { $('msg').textContent = t; }
  function line(box, text, tag) { if (!text) return; var e = document.createElement(tag || 'div'); e.textContent = text; box.appendChild(e); }
  if (!token) { fail('This label link is not valid.'); return; }
  fetch('/api/status?inv=' + encodeURIComponent(token), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (r) {
    if (r.error || !r.invoice) { fail('This label link is not valid.'); return; }
    var inv = r.invoice, s = inv.shipTo;
    if (!s) { fail('This order has no shipping address on it.'); return; }
    line($('from'), inv.brand, 'b');
    line($('from'), inv.returnTo);
    line($('to'), s.name);
    line($('to'), s.company);
    line($('to'), s.street);
    line($('to'), s.line2);
    line($('to'), s.city + ', ' + s.state + ' ' + s.zip);
    $('item').textContent = (inv.item || 'Order') + (inv.qty ? ' x ' + inv.qty : '');
    $('no').textContent = inv.no;
    document.title = 'Label ' + inv.no;
    $('msg').hidden = true; $('tools').hidden = false; $('label').hidden = false;
    $('print').addEventListener('click', function () { window.print(); });
  }, function () { fail('Could not load this label. Check your connection and reload.'); });
})();
</script>
</body>
</html>
