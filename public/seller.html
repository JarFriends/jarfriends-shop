<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Seller portal · JarFriends</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:wght@600;700;800&display=swap">
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/market.css">
</head>
<body>
<header class="top"><div class="wrap bar"><a class="brand" href="/" style="text-decoration:none">JarFriends</a><span style="display:flex;align-items:center;gap:20px"><span class="mono dim">SELLER PORTAL</span><a class="home" href="/market.html">Market</a></span></div></header>
<main class="wrap page" style="gap:28px">
  <div class="stack-s">
    <div class="mono gold" id="kicker">SELL ON JARFRIENDS</div>
    <h1 id="head">Seller portal</h1>
    <div class="small" id="lead">List your collectibles in the JarFriends market. Buyers check out on V2V with card, crypto, Zelle, Venmo, Cash App or cash; you ship the piece and get paid.</div>
  </div>
  <div id="box"></div>
</main>
<script src="/jf.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); }, el = JF.el;
  var tok = JF.token(), D = null, tab = 'listings', editing = null, adding = false;
  // The owner can open any seller's portal from the back office: seller.html?as=<shop>. Uses the back-office key.
  var AS = new URLSearchParams(location.search).get('as') || '', AK = '';
  if (AS) { try { AK = localStorage.getItem('adminKey') || ''; } catch (e) { AK = ''; } }
  var PAY = [['zelle', 'Zelle'], ['venmo', 'Venmo'], ['cashapp', 'Cash App'], ['paypal', 'PayPal']];
  var box = $('box');
  function field(label, input, hint) { var l = el('label', label); l.appendChild(input); if (hint) l.appendChild(el('span', hint, 'hint')); return l; }
  function input(type, value, attrs) { var i = el('input'); i.type = type || 'text'; if (value != null) i.value = value; Object.keys(attrs || {}).forEach(function (k) { i.setAttribute(k, attrs[k]); }); return i; }
  // Package: one of the usual sizes, or a custom size typed in (inches), and the weight in pounds and ounces.
  // pkg is what is saved on the piece; mult is how many pieces go in the box.
  function pkgFields(pkg, mult, hint) {
    pkg = pkg || {}; mult = mult || 1;
    var PRE = D.presets || {};
    var wrap = el('div'); wrap.style.cssText = 'display:flex;flex-direction:column;gap:10px';
    var pre = select(Object.keys(PRE).map(function (k) { return [k, PRE[k].name + ' (' + PRE[k].length + ' x ' + PRE[k].width + ' x ' + PRE[k].height + ' in)']; }).concat([['custom', 'Custom size (type it in)']]), pkg.preset || 'mailer');
    wrap.appendChild(field('Package', pre));
    var dims = el('div', null, 'two');
    var num = function (v, ph) { return input('number', v || '', { min: '0', step: '0.1', inputmode: 'decimal', placeholder: ph }); };
    var L = num(pkg.length, 'Length'), W = num(pkg.width, 'Width'), H = num(pkg.height, 'Height');
    dims.appendChild(field('Length (in)', L)); dims.appendChild(field('Width (in)', W)); dims.appendChild(field('Height (in)', H));
    Array.prototype.forEach.call(dims.children, function (c) { c.style.flex = '1 1 0'; c.style.minWidth = '0'; c.querySelector('input').style.minWidth = '0'; c.querySelector('input').style.width = '100%'; });
    wrap.appendChild(dims);
    var total = pkg.oz ? pkg.oz * mult : 0;
    var lb = num(total ? Math.floor(total / 16) : '', 'lb'), oz = num(total ? Math.round((total % 16) * 10) / 10 : '', 'oz');
    var wt = el('div', null, 'two'); wt.style.cssText = 'display:flex;flex-wrap:nowrap;gap:10px'; wt.appendChild(field('Weight: pounds', lb)); wt.appendChild(field('ounces', oz)); Array.prototype.forEach.call(wt.children, function (c) { c.style.flex = '1 1 0'; c.style.minWidth = '0'; c.querySelector('input').style.width = '100%'; }); wrap.appendChild(wt); if (hint) wrap.appendChild(el('div', hint, 'small dim'));
    var show = function () { var c = pre.value === 'custom'; dims.style.display = c ? 'flex' : 'none'; dims.style.flexWrap = 'nowrap'; dims.style.gap = '10px'; var k = PRE[pre.value]; oz.placeholder = !c && k && !total ? k.oz + ' oz usual' : 'oz'; };
    pre.addEventListener('change', show); show();
    return { node: wrap, read: function () {
      var w = (Number(lb.value) || 0) * 16 + (Number(oz.value) || 0);
      var r = { preset: pre.value, oz: w > 0 ? String(Math.round(w * 10) / 10) : '' };
      if (pre.value === 'custom') { r.l = L.value; r.w = W.value; r.h = H.value; }
      return r;
    } };
  }
  function select(opts, value) { var s = el('select', null, 'jf-sel'); opts.forEach(function (o) { var op = el('option', o[1]); op.value = o[0]; s.appendChild(op); }); if (value != null) s.value = value; return s; }
  function status(text) { var m = el('div', text || '', 'small'); m.setAttribute('role', 'status'); return m; }

  function load() {
    return JF.api('/api/market?do=me&t=' + encodeURIComponent(tok) + (AS ? '&as=' + encodeURIComponent(AS) + '&ak=' + encodeURIComponent(AK) : '')).then(function (r) {
      if (r._status === 401) { if (AS) { box.textContent = 'Your back-office sign-in has run out. Sign in to the back office again, then reopen this portal from the Sellers tab.'; return; } JF.signOut(); tok = ''; return ask(); }
      if (r.error) { box.textContent = r.error; return; }
      D = r;
      if (!r.seller) return applyForm();
      dash();
    }).catch(function () { box.textContent = 'The portal did not load. Refresh to try again.'; });
  }
  function ask() {
    $('head').textContent = 'Seller portal';
    JF.signInBox(box, 'Your V2V account works for buying and selling. Sign in, or create one, to open your shop.', function (t) { tok = t; load(); }, 'signup');
  }

  // ---- Opening a shop ----
  function applyForm() {
    $('kicker').textContent = 'OPEN YOUR SHOP'; $('head').textContent = 'Become a seller';
    box.textContent = '';
    var top = el('div'); box.appendChild(top); JF.modeBar(top, 'seller'); top.style.marginBottom = '18px';
    var c = el('section', null, 'card'); c.style.gap = '18px';
    var how = el('div', null, 'rows');
    [['You list', 'Add pieces with a photo, price, stock and shipping cost. They show in the JarFriends market.'],
     ['Buyers pay JarFriends', 'Checkout, payment and receipts are handled for you.'],
     ['You ship', 'Once an order is paid you see the address here. Ship it and add the tracking number.'],
     ['You get paid', 'JarFriends keeps ' + D.fee + '% of each sale (pieces + shipping). The rest is sent to you by the way you choose below.']].forEach(function (x) {
      var r = el('div', null, 'row'); r.appendChild(el('b', x[0])); var s = el('span', x[1], 'dim'); s.style.textAlign = 'right'; s.style.maxWidth = '70%'; r.appendChild(s); how.appendChild(r);
    });
    c.appendChild(el('h2', 'How it works')); c.appendChild(how);
    var f = el('form');
    var name = input('text', '', { maxlength: '40', required: '', placeholder: 'e.g. Wolf Den Cards' });
    var about = el('textarea', null, 'jf-ta'); about.maxLength = 400; about.placeholder = 'What you collect and sell. Shown on your shop page.';
    var payHow = select([['', 'Choose…']].concat(PAY)), payTo = input('text', '', { maxlength: '80', required: '', placeholder: 'Your handle, phone or email for it' });
    var agree = input('checkbox'); var al = el('label', null, 'jf-check'); al.appendChild(agree);
    al.appendChild(el('span', 'I agree: JarFriends keeps ' + D.fee + '% of each paid sale of my pieces (the price of the pieces plus shipping) and pays me the rest. I ship within 3 days of payment, describe my pieces honestly, and only sell what I own.'));
    var go = el('button', 'Open my shop', 'solid'); go.type = 'submit'; var m = status();
    f.appendChild(field('Shop name', name)); f.appendChild(field('About your shop', about, 'Optional.'));
    var two = el('div', null, 'two'); two.appendChild(field('Pay me by', payHow)); two.appendChild(field('Send it to', payTo)); f.appendChild(two);
    f.appendChild(al); f.appendChild(go); f.appendChild(m);
    c.appendChild(el('h2', 'Your shop')); c.appendChild(f);
    c.appendChild(el('div', 'Signed in as ' + D.email, 'small dim'));
    box.appendChild(c);
    f.addEventListener('submit', function (ev) {
      ev.preventDefault(); go.disabled = true; m.textContent = 'Opening your shop…';
      JF.api('/api/market', { do: 'apply', t: tok, as: AS, ak: AK, name: name.value, about: about.value, payHow: payHow.value, payTo: payTo.value, agree: agree.checked }).then(function (r) {
        go.disabled = false;
        if (r.error) { m.textContent = r.error; return; }
        load();
      });
    });
  }

  // ---- The dashboard ----
  function dash() {
    var s = D.seller, t = D.totals;
    $('kicker').textContent = 'SELLER PORTAL'; $('head').textContent = s.name;
    $('lead').textContent = s.status === 'approved' ? 'Your shop is open. Your pieces show in the market.' : s.status === 'pending' ? 'Your shop is waiting for JarFriends to approve it. You can add your pieces now; they go live the moment you are approved.' : 'Your shop is paused. Contact JarFriends.';
    box.textContent = '';
    var wrap = el('div'); wrap.style.cssText = 'display:flex;flex-direction:column;gap:24px';
    if (!AS) JF.modeBar(wrap, 'seller');
    var badge = el('span', s.status === 'approved' ? 'OPEN' : s.status === 'pending' ? 'WAITING FOR APPROVAL' : 'PAUSED', 'jf-badge ' + (s.status === 'approved' ? 'ok' : s.status === 'pending' ? 'wait' : 'off'));
    var line = el('div', null, 'small'); line.style.cssText = 'display:flex;flex-wrap:wrap;gap:12px;align-items:center'; line.appendChild(badge);
    if (s.status === 'approved') { var sl = el('a', 'See your shop page'); sl.href = '/shop.html?s=' + encodeURIComponent(s.slug); line.appendChild(sl); }
    wrap.appendChild(line);
    if (D.stats) {
      var sl2 = el('div'); sl2.style.cssText = 'display:flex;flex-wrap:wrap;gap:12px;align-items:center';
      sl2.appendChild(JF.stars(D.stats.rating, D.stats.reviews));
      if (D.stats.verified) sl2.appendChild(JF.check());
      else sl2.appendChild(el('span', D.stats.issues ? 'Not verified: ' + D.stats.issues + (D.stats.issues === 1 ? ' order has' : ' orders have') + ' an issue (a 1 or 2 star review, or a problem V2V flagged).' : 'Verified checkmark: ' + D.stats.completed + ' of ' + D.stats.need + ' completed sales with no issues.', 'small dim'));
      wrap.appendChild(sl2);
    }
    if (s.seeded) {
      // The owner's own shop: this is "my shop" back office, with a jump to the site back office.
      $('head').textContent = 'Store office · ' + s.name; $('kicker').textContent = 'YOUR STORE';
      var site = el('div', null, 'small'); site.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px;align-items:center';
      site.appendChild(el('span', 'This is your store office: your own store only. Everything for the whole site (all sellers, buyers, payouts, emails, the giveaway wallet) is in the back office.', 'dim'));
      var sa = el('a', 'Open the back office'); sa.href = '/admin.html'; site.appendChild(sa);
      wrap.appendChild(site);
    } else if (AS) wrap.appendChild(el('div', 'You are viewing this shop as the V2V owner. Anything you change here is saved for this seller.', 'alert small'));
    var tiles = el('div', null, 'jf-tiles');
    [['PAID SALES', String(t.sales), ''], ['SOLD (PIECES + SHIPPING)', JF.cents(t.gross), ''], ['JARFRIENDS FEE (' + D.fee + '%)', JF.cents(t.fee), ''], ['YOU EARNED', JF.cents(t.net), ''], ['PAID TO YOUR BANK BY STRIPE', JF.cents(t.byStripe || 0), ''], ['SENT BY V2V', JF.cents(t.paidOut), ''], ['V2V STILL OWES YOU', JF.cents(t.owed), 'gold']].forEach(function (x) {
      var d = el('div', null, 'jf-tile ' + x[2]); d.appendChild(el('span', x[0], 'label')); d.appendChild(el('b', x[1])); tiles.appendChild(d);
    });
    wrap.appendChild(tiles);
    if (D.stripe && (D.stripe.state === 'none' || D.stripe.state === 'started')) {
      var nudge = el('div', null, 'alert small'); nudge.style.cssText = 'flex-direction:row;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between';
      nudge.appendChild(el('span', D.stripe.state === 'started' ? 'Finish linking your bank so card sales pay you automatically.' : 'Get paid automatically: link your bank with Stripe and card sales go straight to you.'));
      var nb = el('button', 'Set up payouts', 'solid'); nb.type = 'button'; nb.addEventListener('click', function () { tab = 'payouts'; dash(); });
      nudge.appendChild(nb); wrap.appendChild(nudge);
    }
    if (t.unpaidGross) wrap.appendChild(el('div', JF.cents(t.unpaidGross) + ' more is in orders waiting for the buyer to pay. It counts once they pay.', 'small dim'));
    var tabs = el('div', null, 'jf-tabs');
    var toShip = D.orders.filter(function (o) { return o.paid && !o.tracking; }).length;
    [['listings', 'My pieces (' + D.listings.length + ')'], ['posts', 'Community posts'], ['reviews', 'Reviews (' + ((D.reviews || []).length) + ')'], ['offers', 'Offers'], ['trades', 'Trades'], ['orders', 'Orders' + (toShip ? ' · ' + toShip + ' to ship' : '')], ['payouts', 'Payouts'], ['profit', 'Profit'], ['settings', 'Shop settings']].forEach(function (x) {
      var b = el('button', x[1], 'pill'); b.type = 'button'; b.setAttribute('aria-pressed', tab === x[0] ? 'true' : 'false');
      b.addEventListener('click', function () { tab = x[0]; editing = null; adding = false; dash(); }); tabs.appendChild(b);
    });
    wrap.appendChild(tabs);
    var pane = el('div'); pane.style.cssText = 'display:flex;flex-direction:column;gap:18px';
    ({ listings: listings, posts: posts, reviews: reviews, offers: offers, trades: trades, orders: orders, payouts: payouts, profit: profit, settings: settings })[tab](pane);
    wrap.appendChild(pane);
    var out = el('button', 'Sign out', 'ghost'); out.type = 'button'; out.style.alignSelf = 'flex-start';
    out.addEventListener('click', function () { if (AS) { location.href = '/admin.html'; return; } JF.signOut(); location.reload(); });
    if (AS) out.textContent = 'Back to the back office';
    wrap.appendChild(out);
    box.appendChild(wrap);
  }

  // A photo, shrunk on the phone or computer before it is sent: at most 1200 pixels on the long side, as a JPEG.
  function shrink(file) {
    return new Promise(function (ok, bad) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var k = Math.min(1, 1200 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        ok(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = function () { bad(new Error('That file is not a picture we can use.')); };
      img.src = url;
    });
  }

  function listingForm(p) {
    var c = el('section', null, 'card'); c.style.gap = '14px';
    c.appendChild(el('h2', p ? 'Change this piece' : 'Add a piece'));
    var f = el('form'); f.style.maxWidth = '720px';
    var name = input('text', p && p.name, { maxlength: '120', required: '' });
    var desc = el('textarea', null, 'jf-ta'); desc.maxLength = 1200; desc.value = (p && p.desc) || ''; desc.placeholder = 'Condition, grade, edition, what is included.';
    var price = input('number', p && p.price, { min: '1', step: '0.01', required: '', inputmode: 'decimal' });
    var stock = input('number', p ? p.stock : 1, { min: '0', max: '999', step: '1', required: '' });
    // Shipping, the eBay way: free, a flat price, or the live USPS price at checkout. The label is always the seller's cost.
    var shipMode = select([['calc', 'Calculated: buyer pays the real USPS price'], ['flat', 'Flat price'], ['free', 'Free shipping']], p ? (p.shipMode || (p.shipping === 'free' ? 'free' : 'flat')) : 'calc');
    var ship = input('number', p && p.shipping !== 'free' ? p.shipping : '', { min: '0', step: '0.01', inputmode: 'decimal', placeholder: 'e.g. 5.50' });
    var PRE = D.presets || {};
    var pf = pkgFields(p && p.pkg, 1, 'One piece, packed. Leave the weight empty for the usual weight of that package.');
    var sec = select([['', 'Pick a category']].concat(D.sections.map(function (x) { return [x, x]; })), p && p.section);
    // How it sells: buy now (with an optional lowest offer) or a timed auction.
    var live = !!(p && p.auction && Date.parse(p.auction.ends) > Date.now());
    var mode = select([['buy', 'Buy now (buyers can also make offers)'], ['auction', 'Auction (highest bid wins)']], p && p.auction ? 'auction' : 'buy');
    var hours = select((live ? [['', 'Keep the current end time']] : []).concat([['24', '1 day'], ['72', '3 days'], ['120', '5 days'], ['168', '7 days'], ['240', '10 days'], ['336', '14 days'], ['1', '1 hour'], ['6', '6 hours']]), live ? '' : '168');
    var minOffer = input('number', p && p.minOffer ? p.minOffer : '', { min: '0', step: '0.01', inputmode: 'decimal', placeholder: 'Optional' });
    var hidden = input('checkbox'); hidden.checked = !!(p && p.hidden);
    var hl = el('label', null, 'jf-check'); hl.appendChild(hidden); hl.appendChild(el('span', 'Hide it from the market for now'));
    var photo = input('file', null, { accept: 'image/*' });
    var go = el('button', p ? 'Save changes' : 'Add to my shop', 'solid'); go.type = 'submit';
    var m = status();
    f.appendChild(field('Name', name)); f.appendChild(field('Description', desc));
    f.appendChild(field('How it sells', mode));
    var priceL = field('Price (USD)', price), stockL = field('How many you have', stock);
    var two = el('div', null, 'two'); two.appendChild(priceL); two.appendChild(stockL); f.appendChild(two);
    var hoursL = field('Auction length', hours, live ? 'Ends ' + new Date(p.auction.ends).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' }) + '. Last-minute bids add 2 minutes.' : 'Last-minute bids add 2 minutes, so nobody wins by sniping.');
    var minL = field('Lowest offer you will look at (USD)', minOffer, 'Offers under this are declined for you automatically. You answer the rest in the Offers tab.');
    f.appendChild(hoursL); f.appendChild(minL);
    var cost = input('number', p && p.cost != null ? p.cost : '', { min: '0', step: '0.01', inputmode: 'decimal', placeholder: 'Optional' });
    f.appendChild(field('What you paid for it (USD, each)', cost, 'Private: only you see this. When it sells, the Profit tab shows what you made.'));
    var showMode = function () { var a = mode.value === 'auction'; hoursL.hidden = !a; minL.hidden = a; stockL.hidden = a; priceL.firstChild.textContent = a ? 'Starting bid (USD)' : 'Price (USD)'; };
    mode.addEventListener('change', showMode); showMode();
    f.appendChild(field('Shipping', shipMode));
    var shipL = field('Flat shipping price (USD, once per order)', ship);
    f.appendChild(shipL);
    f.appendChild(pf.node);
    var shipNote = el('div', '', 'small dim'); f.appendChild(shipNote);
    var showShip = function () {
      shipL.hidden = shipMode.value !== 'flat';
      shipNote.textContent = shipMode.value === 'calc' ? 'Buyers see the real USPS price from your ZIP to their address at checkout, so the label costs what they paid. Set your ship-from address in Shop settings.'
        : shipMode.value === 'free' ? 'Buyers pay no shipping. You still pay for the label, so build it into your price.'
        : 'Buyers pay this price. The label is your cost: if it costs more, the difference is yours to pay; if less, you keep it.';
    };
    shipMode.addEventListener('change', showShip); showShip();
    f.appendChild(field('Category (buyers filter by this)', sec));
    f.appendChild(field('Photo', photo, p && p.photoUrl ? 'Pick a new one to replace the current photo.' : 'A clear, square-ish photo works best.'));
    f.appendChild(hl);
    var price2 = el('div', '', 'small dim');
    var calc = function () { var v = Number(price.value) || 0; price2.textContent = v ? 'At ' + JF.usd(v) + ' you get ' + JF.usd(v * (1 - D.fee / 100)) + ' after the ' + D.fee + '% JarFriends fee (plus shipping, less its fee).' : ''; };
    price.addEventListener('input', calc); calc(); f.appendChild(price2);
    var row = el('div'); row.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px'; row.appendChild(go);
    var cancel = el('button', 'Cancel', 'ghost'); cancel.type = 'button'; cancel.addEventListener('click', function () { editing = null; adding = false; dash(); }); row.appendChild(cancel);
    f.appendChild(row); f.appendChild(m);
    c.appendChild(f);
    f.addEventListener('submit', function (ev) {
      ev.preventDefault(); go.disabled = true; m.textContent = 'Saving…';
      JF.api('/api/market', { do: 'listing', t: tok, as: AS, ak: AK, id: p ? p.id : '', cost: cost.value, name: name.value, desc: desc.value, price: price.value, stock: mode.value === 'auction' ? 1 : stock.value, shipping: ship.value, shipMode: shipMode.value, pkgPreset: pf.read().preset, pkgOz: pf.read().oz, pkgL: pf.read().l, pkgW: pf.read().w, pkgH: pf.read().h, section: sec.value, hidden: hidden.checked, mode: mode.value, hours: hours.value, minOffer: mode.value === 'auction' ? '' : minOffer.value }).then(function (r) {
        if (r.error) { go.disabled = false; m.textContent = r.error; return; }
        var file = photo.files && photo.files[0];
        if (!file) return finish();
        m.textContent = 'Uploading the photo…';
        return shrink(file).then(function (data) { return JF.api('/api/market', { do: 'photo', t: tok, as: AS, ak: AK, id: r.listing.id, data: data }); }).then(function (x) {
          if (x.error) { go.disabled = false; m.textContent = 'Saved, but the photo did not upload: ' + x.error; return; }
          finish();
        }).catch(function (e) { go.disabled = false; m.textContent = 'Saved, but the photo did not upload: ' + e.message; });
      });
      function finish() { editing = null; adding = false; load(); }
    });
    return c;
  }
  function listings(pane) {
    if (editing) { pane.appendChild(listingForm(editing)); return; }
    if (adding) { pane.appendChild(listingForm(null)); return; }
    // Your pieces come first; the form only opens when you press Add a product.
    var add = el('button', '+ Add a product', 'solid'); add.type = 'button'; add.style.alignSelf = 'flex-start';
    add.addEventListener('click', function () { adding = true; dash(); window.scrollTo(0, 0); });
    pane.appendChild(add);
    if (!D.listings.length) { pane.appendChild(el('div', 'No pieces yet. Press Add a product to list your first one.', 'jf-empty')); return; }
    var list = el('section', null, 'card'); list.style.gap = '0';
    list.appendChild(el('h2', 'Your pieces (' + D.listings.length + ')'));
    D.listings.forEach(function (p) {
      var r = el('div', null, 'jf-row');
      r.appendChild(JF.picture({ id: p.id, name: p.name, photo: p.photoUrl }));
      var mid = el('div'); mid.style.cssText = 'flex:1;min-width:0;display:flex;flex-direction:column;gap:4px';
      mid.appendChild(el('b', p.name));
      if (p.auction) mid.appendChild(el('span', Date.parse(p.auction.ends) > Date.now() ? 'AUCTION · ENDS ' + new Date(p.auction.ends).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' }).toUpperCase() : 'AUCTION ENDED', 'jf-badge wait'));

    bar.appendChild(field('Year', yr));
    var dl = el('button', 'Download spreadsheet', 'solid'); dl.type = 'button'; bar.appendChild(dl);
    c.appendChild(bar);
    var tiles = el('div', null, 'jf-tiles'); c.appendChild(tiles);
    var list = el('div'); c.appendChild(list);
    pane.appendChild(c);
    var pick = function () { return rows.filter(function (r) { return yr.value === 'all' || String(new Date(r.at).getFullYear()) === yr.value; }); };
    var money = function (v) { return v == null ? '' : (v < 0 ? '-' : '') + JF.cents(Math.abs(v)); };
    function draw() {
      var rs = pick(), t = { gross: 0, fee: 0, label: 0, cost: 0, other: 0, profit: 0, missing: 0 };
      rs.forEach(function (r) { t.gross += r.gross; t.fee += r.fee; t.label += r.label; t.other += r.other; if (r.cost == null) t.missing++; else { t.cost += r.cost; t.profit += r.profit; } });
      tiles.textContent = '';
      [['SALES', JF.cents(t.gross), ''], ['V2V FEES', JF.cents(t.fee), ''], ['LABELS', JF.cents(t.label), ''], ['WHAT YOU PAID', JF.cents(t.cost), ''], ['OTHER COSTS', JF.cents(t.other), ''], ['PROFIT', money(t.profit), 'gold']].forEach(function (x) {
        var d = el('div', null, 'jf-tile ' + x[2]); d.appendChild(el('span', x[0], 'label')); d.appendChild(el('b', x[1])); tiles.appendChild(d);

        var top = el('div'); top.style.cssText = 'display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px';

        row.appendChild(top);
        row.appendChild(el('div', new Date(r.at).toLocaleDateString('en-US', { dateStyle: 'medium' }) + ' · order ' + r.n + ' · sold ' + JF.cents(r.gross) + ' · V2V fee ' + JF.cents(r.fee) + (r.label ? ' · label ' + JF.cents(r.label) : ''), 'small dim'));
        var ed = el('div'); ed.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-top:6px';
        var ci = input('number', r.cost == null ? '' : (r.cost / 100).toFixed(2), { min: '0', step: '0.01', inputmode: 'decimal' });
        var oi = input('number', r.other ? (r.other / 100).toFixed(2) : '', { min: '0', step: '0.01', inputmode: 'decimal', placeholder: '0.00' });
        var ni = input('text', r.note || '', { maxlength: '200', placeholder: 'Supplies, card fee…' });
        [[field('What you paid (total)', ci), '1 1 130px'], [field('Other costs', oi), '1 1 110px'], [field('Note', ni), '2 1 180px']].forEach(function (x) { x[0].style.flex = x[1]; x[0].style.minWidth = '0'; ed.appendChild(x[0]); });
        var sv = el('button', 'Save', 'ghost'); sv.type = 'button'; ed.appendChild(sv);
        var m = el('span', '', 'small'); ed.appendChild(m);
        sv.addEventListener('click', function () {
          sv.disabled = true;
          JF.api('/api/market', { do: 'cost-set', t: tok, as: AS, ak: AK, n: r.n, cost: ci.value, other: oi.value, note: ni.value }).then(function (x) {
            sv.disabled = false; if (x.error) { m.textContent = x.error; return; }
            r.cost = ci.value === '' ? null : Math.round(Number(ci.value) * 100); r.other = oi.value === '' ? 0 : Math.round(Number(oi.value) * 100); r.note = ni.value;

        });

        list.appendChild(row);

    }
    yr.addEventListener('change', draw); draw();
    // The spreadsheet: a CSV file, which Excel, Numbers and Google Sheets all open.
    dl.addEventListener('click', function () {
      var q = function (v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
      var d2 = function (c) { return c == null ? '' : (c / 100).toFixed(2); };
      var lines = [['Date', 'Order', 'Item', 'Quantity', 'Paid with', 'Sale (pieces + shipping)', 'V2V fee', 'Shipping label', 'What you paid', 'Other costs', 'Profit', 'Note'].join(',')];
      var rs = pick().slice().sort(function (a, b) { return a.at - b.at; }), tot = [0, 0, 0, 0, 0, 0];

        tot[0] += r.gross; tot[1] += r.fee; tot[2] += r.label; tot[3] += r.cost || 0; tot[4] += r.other; tot[5] += r.profit || 0;
      });
      lines.push(['Total', '', '', '', '', d2(tot[0]), d2(tot[1]), d2(tot[2]), d2(tot[3]), d2(tot[4]), d2(tot[5]), ''].map(q).join(','));
      var blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });

    if (!D.payouts.length) c.appendChild(el('div', 'No payouts yet.', 'small dim'));

    pane.appendChild(c);
    f.addEventListener('submit', function (ev) { ev.preventDefault(); go.disabled = true; JF.api('/api/market', { do: 'profile', t: tok, as: AS, ak: AK, shipFrom: { name: fn.value, street1: fs1.value, street2: fs2.value, city: fc.value, state: fst.value, zip: fz.value, phone: fp.value }, about: about.value, payHow: payHow.value, payTo: payTo.value }).then(function (r) { go.disabled = false; m.textContent = r.error || 'Saved.'; if (!r.error) D.seller = r.seller; }); });
  }

  var sq = new URLSearchParams(location.search).get('stripe');
  if (sq) {
