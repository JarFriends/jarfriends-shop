  var sq = new URLSearchParams(location.search).get('stripe');
  if (sq) {
    tab = 'payouts';
    var clean = location.pathname + (AS ? '?as=' + encodeURIComponent(AS) : '');
    history.replaceState(null, '', clean);
    if (sq === 'again') JF.api('/api/market', { do: 'stripe-setup', t: tok, as: AS, ak: AK }).then(function (r) { if (r.url) location.href = r.url; });
  }
  if (tok || AS) load(); else ask();
})();
</script>
